function bindDeck(d){
  const id = d.id, el = s => $(`${id}-${s}`);
  d.ui = {zoom: el('zoom'), over: el('over'), empty: el('empty'), title: el('title'), time: el('time'), fname: el('fname'), bpm: el('bpm'),
          sync: el('sync'), play: el('play'), playlbl: el('playlbl'), air: el('air'), meter: el('meter')};
  d.ctl.vol = new Ctl(el('vol'), {type: 'v', min: 0, max: 100, value: 100, label: `Fader voie ${id}`, onGrab: takeOver,
    onChange: v => d.fader.gain.setTargetAtTime(Math.pow(v / 100, 1.6), ctx.currentTime, 0.02)});
  el('hp').addEventListener('click', () => setCue(d, !d.cueOn));

  const fileIn = el('file');
  d.ui.play.addEventListener('click', () => {
    if (!d.buffer){ fileIn.click(); return; }
    d.playing ? d.pause() : smartStart(d);
  });
  fileIn.addEventListener('change', e => {
    const files = [...e.target.files]; e.target.value = '';
    if (!files.length) return;
    const first = addFiles(files, d.item);
    loadItem(first, id);
    if (files.length > 1) toast(`${files.length} morceaux ajoutés à la playlist.`);
  });
  el('eject').addEventListener('click', () => {
    if (!d.buffer) return;
    if (d.playing){ toast(`La platine ${id} joue : mets-la en pause avant d'éjecter.`); return; }
    if (plan && (plan.n === d || plan.o === d)) plan = null;
    d.unload();
  });
  d.ui.sync.addEventListener('click', () => syncDeck(d));
  el('qfile').addEventListener('change', e => {
    const files = [...e.target.files]; e.target.value = '';
    if (!files.length) return;
    const at = addFiles(files);
    d.queue.push(...lib.slice(at, at + files.length)); renderQueue(d); saveQueues();
    if (!d.buffer && !d.playing && !d.loading){ const t = d.queue.shift(); renderQueue(d); saveQueues(); loadItem(lib.indexOf(t), d.id); }
    else toast(`${files.length} son${files.length > 1 ? 's' : ''} ajouté${files.length > 1 ? 's' : ''} à la file de la platine ${d.id}.`, 2600);
    if (auto && endOfList){ const cur = Object.values(decks).find(x => x.playing); if (cur){ endOfList = false; queueNext(cur, other(cur)); } }
  });
  el('back').addEventListener('click', () => {
    if (!d.buffer) return;
    const atCue = Math.abs(d.pos() - d.cue) < 0.05;
    d.pause(); d.offset = atCue ? 0 : d.cue;
  });

  // Pads : toucher = jouer ; bouton « Sample n ✎ » = choisir ton propre son
  for (let i = 0; i < 4; i++){
    const pad = el(`pad${i}`);
    pad.addEventListener('pointerdown', () => { d.trigger(i); pad.classList.add('hit'); setTimeout(() => pad.classList.remove('hit'), 140); });
    pad.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ d.trigger(i); e.preventDefault(); } });
    el(`padset${i}`).addEventListener('click', () => { padTarget = {d, i}; $('pad-file').click(); });
  }
  // Toucher l'écran vide ouvre aussi tes musiques
  d.ui.zoom.parentElement.addEventListener('click', e => { if (!d.buffer && !d.loading && !e.target.closest('label')) fileIn.click(); });

  // Module effets
  const amtWrap = el('amtwrap');
  const kEl = document.createElement('div'); kEl.className = 'knob metal'; amtWrap.appendChild(kEl);
  const ticks = el('ticks');
  for (let v = 0; v <= 10; v++){
    const a = (-135 + 27 * v - 90) * Math.PI / 180, R = 66;
    const s = document.createElement('span'); s.textContent = v;
    s.style.left = `${75 + Math.cos(a) * R}px`; s.style.top = `${75 + Math.sin(a) * R}px`; ticks.appendChild(s);
  }
  new Ctl(kEl, {min: 0, max: 10, value: 0, color: '#20e6e8', label: `FX amount ${id}`, onChange: v => { d.fxAmt = v / 10; d.applyFx(); }});
  const FX = ['flanger', 'echo', 'reverb', 'chorus'];
  FX.forEach(name => el(`fx-${name}`).addEventListener('click', () => {
    d.fx = name; d.applyFx();
    FX.forEach(n => el(`fx-${n}`).setAttribute('aria-pressed', String(n === name)));
    if (d.fxAmt === 0) toast('Tourne FX AMOUNT pour entendre l\'effet.', 2600);
  }));
  const rf = el('rf');
  knob(rf, 'Rate', 'mid', {min: 0, max: 100, value: 40, color: '#20e6e8',
    format: v => d.fx === 'echo' ? `${ECHO_DIV[Math.round(v / 100 * (ECHO_DIV.length - 1))]} T` : `${Math.round(v)}%`,
    onChange: v => { d.fxRate = v / 100; d.applyFx(); }});
  knob(rf, 'Feedback', 'mid', {min: 0, max: 100, value: 50, color: '#20e6e8', format: v => `${Math.round(v)}%`,
    onChange: v => { d.fxFb = v / 100; d.applyFx(); }});

  // Vue d'ensemble : toucher pour se déplacer
  const over = d.ui.over; let overDown = false;
  const seekFrom = e => { if (!d.buffer) return; const r = over.getBoundingClientRect(); d.seek(clamp((e.clientX - r.left) / r.width, 0, 1) * d.duration); };
  over.addEventListener('pointerdown', e => { overDown = true; over.setPointerCapture(e.pointerId); seekFrom(e); });
  over.addEventListener('pointermove', e => { if (overDown && !d.playing) seekFrom(e); });
  over.addEventListener('pointerup', () => overDown = false);
}
let padTarget = null;
$('pad-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !padTarget) return;
  try {
    const buf = await decode(await f.arrayBuffer());
    const {d, i} = padTarget, name = f.name.replace(/\.[^.]+$/, '');
    d.samples[i] = {name, buffer: buf}; $(`${d.id}-padn${i}`).textContent = name; $(`${d.id}-padset${i}`).classList.add('custom');
    d.trigger(i);
    try { await idb('samples', 'readwrite', st => st.put({name, blob: f}, `${d.id}${i}`)); toast(`Sample ${i + 1} : ${name}. Il restera sur ce pad la prochaine fois.`, 3200); }
    catch(err){ toast(`Sample ${i + 1} : ${name}. Pas de place pour le garder : il sera à remettre la prochaine fois.`); }
  } catch(err){ toast('Ce son n\'a pas pu être lu. Essaie un MP3, WAV ou M4A.'); }
});
Object.values(decks).forEach(bindDeck);

// START MIX calé : si l'autre platine joue, cale le tempo, attend la prochaine mesure
// et démarre au même endroit de la phrase de 4 mesures, barre sur barre.
let alignHintShown = false;
function smartStart(d){
  const o = other(d);
  if (!o.playing || o.t0 > ctx.currentTime || !o.bpm || !d.bpm){ d.play(); return; }
  const r = tempoRatio(o, d);
  const canSync = Math.abs(r - 1) <= 0.16;
  if (canSync) d.setRate(r);
  const oBar = 4 * o.beatLen, pos = o.pos();
  const k = Math.ceil((pos + 0.12 * o.rate - o.firstBeat) / oBar);
  const when = ctx.currentTime + (o.firstBeat + k * oBar - pos) / o.rate;
  const phase = mod(k, 4), dBar = 4 * d.beatLen;
  let start;
  if (d.offset >= d.duration - 0.05 || Math.abs(d.offset - d.cue) < 0.05 || d.offset < d.cue) start = d.cue + phase * dBar;
  else start = d.firstBeat + Math.round((d.offset - d.firstBeat) / dBar) * dBar;
  if (start > d.duration - dBar) start = d.cue;
  d.playAt(when, start);
  if (!alignHintShown){ alignHintShown = true; toast(canSync ? `Calé sur la mesure de la platine ${o.id} : départ barre sur barre.` : `Tempos trop éloignés : départ sur la mesure de la platine ${o.id}, sans changer le tempo.`); }
}
const tempoRatio = (o, n) => [o.bpm * o.rate, o.bpm * o.rate * 2, o.bpm * o.rate / 2].map(t => t / n.bpm).reduce((a, b) => Math.abs(b - 1) < Math.abs(a - 1) ? b : a);
function syncDeck(d){
  const o = other(d);
  if (!d.buffer || !o.buffer || !d.bpm || !o.bpm){ toast('Charge un morceau sur les deux platines pour synchroniser.'); return; }
  const r = tempoRatio(o, d);
  if (Math.abs(r - 1) > 0.16){ toast('Écart de tempo trop grand (plus de 16 %).'); return; }
  d.setRate(r);
  if (!o.playing) return;
  const myBeatReal = d.beatLen / d.rate;
  const target = mod(mod(o.pos() - o.firstBeat, o.beatLen) / o.rate, myBeatReal);
  const myPos = d.pos();
  let diff = target - mod(myPos - d.firstBeat, d.beatLen) / d.rate;
  if (diff > myBeatReal / 2) diff -= myBeatReal; if (diff < -myBeatReal / 2) diff += myBeatReal;
  d.seek(myPos + diff * d.rate);
}

// Crossfader « DJ » : au centre, les deux voies sont à fond ; il ne coupe qu'en allant vers un bord
const xfCurve = (x, id) => id === 'A' ? (x <= 0.5 ? 1 : Math.cos((x - 0.5) * Math.PI)) : (x >= 0.5 ? 1 : Math.cos((0.5 - x) * Math.PI));
function applyXf(v, t = ctx.currentTime, tc = 0.015){
  const x = v / 100;
  decks.A.xf.gain.setTargetAtTime(xfCurve(x, 'A'), t, tc);
  decks.B.xf.gain.setTargetAtTime(xfCurve(x, 'B'), t, tc);
}
const xfCtl = new Ctl($('xfader'), {type: 'h', min: 0, max: 100, value: 50, detent: true, label: 'Crossfader', onGrab: takeOver, onChange: v => applyXf(v)});
xfCtl.set(50, 'force');

/* ---------- Smart Fader : un mix comme un DJ ----------
   1. B entre sur une phrase de A, basses coupées, médiums et aigus baissés, volume bas.
   2. Temps après temps, B monte doucement (volume, médiums, aigus) pendant que les aigus de A baissent un peu.
   3. Le drop de B tombe pile sur une phrase de A (début de sa sortie si possible) :
      basses de B à fond, basses de A baissées (-14 dB).
   4. A reste mélangé quelques mesures puis s'efface temps par temps.
      Si B coupe ses basses pour un break / une montée, A est coupé au même moment. */
let auto = false, plan = null, transBeats = 32, waitFree = null, endOfList = false;
// Un effet différent à chaque mix, comme un DJ
const STYLES = [['clean', 'CFX']];
let mixCount = Math.floor(Math.random() * STYLES.length);
function fxAt(d, v, t, tc = 0.05){
  const a = v.amt || 0, nm = v.name, set = (g, x) => g.gain.setTargetAtTime(x, t, tc);
  set(d.flWet, nm === 'flanger' ? a * 0.85 : 0); set(d.chWet, 0); set(d.rvWet, 0);
  set(d.ecWet, nm === 'echo' ? a * 0.85 : 0); set(d.crWet, nm === 'crush' ? a : 0);
  set(d.dry, nm === 'flanger' ? 1 - 0.4 * a : nm === 'crush' ? 1 - 0.85 * a : 1);
  if (nm === 'flanger'){ d.flL.o.frequency.setTargetAtTime(0.18, t, 0.1); d.flFb.gain.setTargetAtTime(0.75, t, 0.1); }
  if (nm === 'echo'){ d.ecFb.gain.setTargetAtTime(v.fb ?? 0.6, t, 0.02); d.ecD.delayTime.setTargetAtTime((v.rate ?? 0.75) * 60 / (d.bpm * d.rate), t, 0.01); }
  if (nm === 'reverb'){
    if (!d.rvOn){ d.makeIR(3.5); d.post.connect(d.conv); d.rvOn = true; }
    d.rvTone.frequency.setTargetAtTime(7000, t, 0.1);
    set(d.rvWet, a * 0.9);
  }
}
function restoreDeck(d){
  const now = ctx.currentTime;
  [d.gate.gain, d.input.gain].forEach(g => { g.cancelScheduledValues(now); g.setTargetAtTime(1, now, 0.01); });
  fxAt(d, {name: 'none'}, now, 0.02); d.applyFx();
}

// Présence de la ligne de basse, mesure par mesure : on mesure les basses ENTRE les coups de grosse caisse
// (de 35 % à 95 % de chaque temps), sinon le kick masque tout.
function barEnergy(t){
  if (t.barE) return t.barE;
  const beat = 60 / t.bpm, nb = Math.floor((t.buffer.duration - t.firstBeat) / (4 * beat)), lo = t.peaks.lo, e = [];
  for (let b = 0; b < nb; b++){
    let acc = 0, cnt = 0;
    for (let q = 0; q < 4; q++){
      const t0 = t.firstBeat + (b * 4 + q) * beat;
      const s0 = Math.floor((t0 + 0.35 * beat) * RES), s1 = Math.floor((t0 + 0.95 * beat) * RES);
      for (let i = s0; i < s1 && i < lo.length; i++){ acc += lo[i]; cnt++; }
    }
    e.push(acc / Math.max(1, cnt));
  }
  return (t.barE = e);
}

// Fin réelle de la musique (sans le silence final)
function endOfMusic(t){
  const bar = 240 / t.bpm, nb = Math.floor((t.buffer.duration - t.firstBeat) / bar), r = t.peaks.rms, e = [];
  for (let b = 0; b < nb; b++){ const s0 = Math.floor((t.firstBeat + b * bar) * RES), s1 = Math.floor((t.firstBeat + (b + 1) * bar) * RES); let a = 0; for (let i = s0; i < s1 && i < r.length; i++) a += r[i]; e.push(a / Math.max(1, s1 - s0)); }
  const mean = e.reduce((a, b) => a + b, 0) / Math.max(1, e.length);
  let k = e.length - 1; while (k > 0 && e[k] < 0.12 * mean) k--;
  return Math.min(t.buffer.duration, t.firstBeat + (k + 1) * bar);
}

// Début sur fin : B démarre toujours à son début (1er temps), sur la fin de A.
// Son intro passe pendant la fin de A, et son drop tombe sur le début de la sortie de A.
// Le mix comme un DJ :
// - P = 1er temps d'une phrase de 32 temps de A, là où sa ligne de basse se termine
// - B est lancé sur sa 1re frappe, exactement autant de temps avant P que dure son intro,
//   pour que sa 1re basse tombe pile sur P (le « 1 » de la phrase)
function makePlan(o, n){
  if (!o.buffer || !n.buffer || !o.bpm || !n.bpm) return null;
  const so = structureOf(o.item), sn = structureOf(n.item);
  let r = tempoRatio(o, n); const synced = Math.abs(r - 1) <= 0.16; if (!synced) r = 1;
  const ob = o.beatLen, nb = n.beatLen, pos = o.pos(), lead = 1.2 * o.rate;
  const E = endOfMusic(o.item);
  // B part toujours sur un début de SA phrase de 32 temps, A est compté sur SES phrases : les blocs de 32 tombent ensemble
  const nStart = n.item.start ?? n.firstBeat, oPh = o.firstBeat;   // B part toujours sur son 1er kick
  const phrase = 32 * ob;
  const grid = (t, step, up) => oPh + (up ? Math.ceil((t - oPh) / step - 1e-6) : Math.floor((t - oPh) / step + 1e-6)) * step;
  // Intro de B jusqu'à l'arrivée de sa basse / de son kick plein (en temps)
  const introB = Math.max(0, Math.round((sn.drop - nStart) / nb));
  // Durée de B en arrière-plan (basses coupées) avant le swap : 32 temps (mix long), 16 (court) ou 0 (swap direct)
  const bgFor = max => {
    if (!synced) return Math.min(16, max);
    if (introB === 0) return max >= 32 ? 32 : max >= 16 ? 16 : 0;   // kick dès le début : 32 temps d'arrière-plan
    const fit = Math.min(introB, max);
    return fit >= 32 ? Math.floor(fit / 32) * 32 : fit >= 16 ? 16 : 0;
  };
  const limit = Math.min(so.outro, E - 4 * ob);       // le swap doit avoir lieu avant la fin des basses de A
  let aStart, I;
  // Règle principale : la 1re basse de B (B1) part EN MÊME TEMPS que la dernière ligne de basse de A (B2).
  // B est lancé sur son 1er kick (K) exactement la longueur de son intro avant.
  // K2 = point de lancement sur A : B2 de A moins la durée K→B1 de B. Le K de B tombe sur K2, donc B1 tombe sur B2.
  const Ifull = Math.round(introB / 4) * 4;
  let useB2 = false, why = '';
  if (!synced) why = 'Tempos trop éloignés';
  else if (so.lastBass == null) why = `Pas de B2 trouvé sur ${o.id}`;
  else if (so.lastBass - Ifull * ob < pos + lead) why = 'K2 déjà passé';
  else if (so.lastBass > E - 4 * ob) why = `B2 trop près de la fin de ${o.id}`;
  else { aStart = so.lastBass - Ifull * ob; I = Ifull; useB2 = true; }
  if (!useB2){
  // Sinon : le dernier début de bloc de 32 temps de A qui laisse toute l'intro de B avant la fin de A
  I = bgFor(128);
  aStart = grid(limit - I * ob, phrase, false);
  }
  if (!useB2 && aStart < pos + lead){
    // Trop tard : prochain bloc de 32 temps, et arrière-plan raccourci pour tenir avant la fin
    aStart = grid(pos + lead, phrase, true);
    if (aStart > limit) aStart = grid(pos + lead, 16 * ob, true);
    if (aStart > E - 4 * ob) aStart = grid(pos + lead, 4 * ob, true);
    I = bgFor(Math.max(0, Math.floor((limit - aStart) / ob)));
  }
  const P = aStart + I * ob;
  // B part sur son 1er kick (kick dès le début) ou I temps avant sa basse : son swap tombe pile sur P
  const bStart = introB === 0 ? nStart : sn.drop - I * nb;
  const eB = barEnergy(n.item), dBar = Math.max(0, Math.round((bStart + I * nb - n.firstBeat) / (4 * nb)));
  const refE = eB.slice(dBar, dBar + 4).reduce((a, b) => a + b, 0) / Math.max(1, Math.min(4, eB.length - dBar));
  // Point de coupe C du son sortant (en mesures après le swap) :
  // - si les basses du son qui entre s'arrêtent (break / montée) : A est coupé là ;
  // - sinon A reste avec B jusqu'à la fin de sa basse (F), 16 mesures au plus, calé par blocs de 4 mesures.
  const roomBars = Math.max(1, Math.floor((E - P) / (4 * ob)));
  const postBars = clamp(roomBars, 1, 16);
  let cutBar = null;
  for (let k = 1; k <= postBars && dBar + k < eB.length; k++){ if (eB[dBar + k] < 0.5 * refE){ cutBar = k; break; } }
  let cutBars = cutBar;
  if (!cutBars){
    const toF = Math.round((so.outro - P) / (4 * ob));
    cutBars = clamp(toF >= 4 ? Math.round(toF / 4) * 4 : 4, 4, 16);
    cutBars = Math.min(cutBars, roomBars);
  }
  return {o, n, rate: r, synced, useB2, why, cutBars, cut: P + cutBars * 4 * ob, Lp: I, P, oldStart: aStart, trigger: Math.min(aStart, P - 8 * ob), bStart, postBars, cutBar,
          totalBeats: I + cutBars * 4 + 8, style: STYLES[mixCount % STYLES.length], scheduled: false};
}
const planStartReal = p => p.scheduled ? p.T0 : ctx.currentTime + (p.oldStart - p.o.pos()) / p.o.rate;

function replanIfNeeded(){
  if (plan && plan.scheduled) return;
  plan = null;
  if (!auto) return;
  const playing = Object.values(decks).filter(d => d.playing);
  if (playing.length !== 1) return;
  const o = playing[0], n = other(o);
  if (n.buffer && !n.playing) plan = makePlan(o, n);
}

// Règle un potard au temps exact (horloge audio) et met l'écran à jour au même moment
function paramAt(d, key, v, t, tc = 0.03){
  if (key === 'xf') applyXf(v, t, tc);
  else if (key === 'vol') d.fader.gain.setTargetAtTime(Math.pow(v / 100, 1.6), t, tc);
  else if (key === 'filt'){
    const f = d.filt;
    if (Math.abs(v) <= 2){ if (f.type === 'highpass') f.frequency.setTargetAtTime(20, t, tc); else f.frequency.setTargetAtTime(22000, t, tc); }
    else if (v < 0){
      if (f.type !== 'lowpass'){ f.frequency.cancelScheduledValues(0); f.frequency.setValueAtTime(22000, ctx.currentTime); f.type = 'lowpass'; }
      f.Q.value = 1.2; f.frequency.setTargetAtTime(20000 * Math.pow(0.01, -v / 100), t, tc);
    }
    else {
      if (f.type !== 'highpass'){ f.frequency.cancelScheduledValues(0); f.frequency.setValueAtTime(20, ctx.currentTime); f.type = 'highpass'; f.Q.value = 1.2; }
      f.frequency.setTargetAtTime(20 * Math.pow(150, v / 100), t, tc);
    }
  }
  else if (key === 'gate') d.gate.gain.setTargetAtTime(v, t, tc);
  else if (key === 'input') d.input.gain.setTargetAtTime(v, t, tc);
  else if (key === 'fx') fxAt(d, v, t, tc);
  else d[key].gain.setTargetAtTime(v <= -25.5 ? -45 : v, t, tc);
}
function schedule(d, key, v, t, tc){ plan.events.push({d, key, v, t, tc}); }

function startTransition(dt){
  const {o, n} = plan, now = ctx.currentTime, T0 = now + Math.max(0.02, dt), beat = o.beatLen / o.rate, L = plan.Lp;
  // Si on est en retard sur K2, B démarre un peu plus loin dans son morceau : son K reste collé au K2 de A
  const late0 = Math.max(0, 0.02 - dt) * plan.rate;
  const tDrop = now + (plan.P - o.pos()) / o.rate;
  plan.events = []; plan.T0 = T0; plan.tDrop = tDrop;
  n.setRate(plan.rate);
  if (n.filt.type !== 'lowpass'){ n.filt.type = 'lowpass'; n.filt.Q.value = 0.7; }
  // B prêt avant d'entrer : basses coupées, médiums -9 dB, aigus -5 dB, volume bas
  const pre = [['lo', -26], ['mid', -9], ['hi', -5], ['filt', 0], ['vol', 42]];
  pre.forEach(([k, v]) => { paramAt(n, k, v, now, 0.01); n.ctl[k].set(v, false); });
  // Anti « pop » : B démarre 8 ms avant son kick avec un micro fondu, le kick reste pile sur le temps
  const preroll = Math.min(0.008, plan.bStart);
  n.input.gain.cancelScheduledValues(0); n.input.gain.setValueAtTime(0, T0 - preroll / plan.rate);
  n.input.gain.linearRampToValueAtTime(1, T0 - preroll / plan.rate + 0.006);
  n.playAt(T0 - preroll / plan.rate, plan.bStart + late0 - preroll);
  n.t0 = T0 - preroll / plan.rate;
  schedule(null, 'xf', 50, T0, 0.05);
  // Montée douce, temps par temps
  for (let i = 1; i < L; i++){
    const f = i / L, t = T0 + i * beat;
    schedule(n, 'vol', Math.round(42 + 46 * f), t, 0.06);
    if (i % 4 === 0){ schedule(n, 'mid', Math.round(-9 + 8 * f), t, 0.08); schedule(n, 'hi', Math.round(-5 + 5 * f), t, 0.08); schedule(o, 'hi', Math.round(-4 * f), t, 0.08); }
  }
  // Bass swap : sur le temps fort, basses de A coupées net et basses de B libérées, instantanément
  schedule(n, 'lo', 0, tDrop, 0.002); schedule(o, 'lo', -26, tDrop, 0.002);
  schedule(n, 'vol', 100, tDrop, 0.02); schedule(n, 'mid', 0, tDrop, 0.02); schedule(n, 'hi', 0, tDrop, 0.02);
  const bar = 4 * beat, st = plan.style[0], pre8 = Math.max(now + 0.05, tDrop - 8 * beat), n8 = Math.round((tDrop - pre8) / beat);
  // Coup de CFX sur A à chaque transition, sur ses 8 derniers temps : un mix sur deux dans les aigus (passe-haut),
  // l'autre dans les graves (passe-bas)
  // CFX léger pour habiller : long (16 temps) sur un mix long, court (4 temps) sur un mix court
  const cfx = mixCount % 2 === 0 ? 1 : -1, longMix = L >= 32, span = longMix ? 16 : 4;
  plan.cfx = `CFX ${longMix ? 'long' : 'court'} · ${cfx > 0 ? 'aigus' : 'graves'}`;
  mixCount++;
  const c0 = Math.max(now + 0.05, tDrop - span * beat), cn = Math.round((tDrop - c0) / beat);
  for (let i = 1; i <= cn; i++) schedule(o, 'filt', Math.round(cfx * (cfx > 0 ? 45 : 40) * Math.pow(i / cn, 1.4)), c0 + i * beat, longMix ? 0.08 : 0.04);
  schedule(o, 'filt', cfx > 0 ? 60 : -60, tDrop + beat, 0.12);
  if (st === 'flanger'){
    for (let i = 0; i <= n8; i += 2) schedule(o, 'fx', {name: 'flanger', amt: 0.1 + 0.55 * i / Math.max(1, n8)}, pre8 + i * beat, 0.25);
    schedule(o, 'fx', {name: 'flanger', amt: 0.3}, tDrop + 2 * beat, 0.4);
    schedule(o, 'fx', {name: 'none'}, tDrop + bar, 0.5);
  } else if (st === 'crush'){
    for (let i = 0; i <= n8; i += 2) schedule(o, 'fx', {name: 'crush', amt: 0.1 + 0.5 * i / Math.max(1, n8)}, pre8 + i * beat, 0.15);
    schedule(o, 'fx', {name: 'none'}, tDrop, 0.35);
  }
  // Sortie de A au point C, comme un DJ :
  // - sur un break de B : A coupé net sur le temps ;
  // - sinon A s'efface en douceur sur les 16 temps qui mènent à C, avec juste un voile de reverb.
  const tCut = tDrop + plan.cutBars * bar, onBreak = !!plan.cutBar;
  if (onBreak){ schedule(o, 'vol', 0, tCut, 0.02); plan.tFade = tCut; plan.tEnd = tCut + 0.3; }
  else {
    const fb = Math.min(16, plan.cutBars * 4), t0 = tCut - fb * beat;
    for (let i = 1; i <= fb; i++) schedule(o, 'vol', Math.round(100 * Math.pow(1 - i / fb, 1.3)), t0 + i * beat, 0.12);
    schedule(o, 'fx', {name: 'reverb', amt: 0.25}, t0 + fb / 2 * beat, 0.6);
    plan.tFade = t0; plan.tEnd = tCut + 0.3;
  }
  plan.events.sort((a, b) => a.t - b.t);
  plan.scheduled = true;
}

function finishTransition(){
  const {o, n} = plan, manual = plan.manual; plan = null;
  restoreDeck(o);
  // B toujours à fond à la fin du mix (même si A s'est arrêté avant la basse de B)
  ['lo', 'mid', 'hi'].forEach(k => { if (n.ctl[k].value !== 0) n.ctl[k].set(0); });
  if (n.ctl.vol.value < 100) n.ctl.vol.set(100);
  if (manual){ waitFree = {cur: n, free: o}; return; }
  o.pause();
  ['lo', 'mid', 'hi', 'filt'].forEach(k => o.ctl[k].set(0));
  o.ctl.vol.set(100);
  xfCtl.set(n.id === 'A' ? 0 : 100);
  if (auto) queueNext(n, o);
}

function autoTick(){
  if (waitFree && !waitFree.free.playing){ const w = waitFree; waitFree = null; if (auto) queueNext(w.cur, w.free); }
  if (!plan) return;
  const {o, n} = plan, now = ctx.currentTime;
  if (!plan.scheduled){
    if (n.playing){ plan = null; return; }
    if (!o.playing) return;
    if (o.pos() > plan.oldStart + 0.05){ plan = makePlan(o, n); return; }
    if ((plan.trigger - o.pos()) / o.rate < 0.35) startTransition((plan.oldStart - o.pos()) / o.rate);
    return;
  }
  // Arme les réglages ~0,3 s à l'avance sur l'horloge audio, puis met l'écran à jour au bon moment
  for (const ev of plan.events){
    if (ev.done) continue;
    if (!ev.armed && !plan.manual && ev.t - now < 0.3){ paramAt(ev.d, ev.key, ev.v, ev.t, ev.tc); ev.armed = true; }
    if (ev.armed && now >= ev.t){ const c = ev.key === 'xf' ? xfCtl : ev.d.ctl[ev.key]; if (c) c.set(ev.v, false); ev.done = true; }
  }
  // (si A s'arrête avant le swap, B récupère tout de suite ses basses ; après le swap on laisse finir la queue de reverb)
  if (now >= plan.tEnd || !n.playing || (!o.playing && now > plan.T0 && now < plan.tDrop)) finishTransition();
}

function nextIndexAfter(item){ const i = lib.indexOf(item); return i >= 0 && i + 1 < lib.length ? i + 1 : -1; }
// Prochain son : d'abord la file « À suivre » de la platine libre, puis celle de l'autre, puis l'ordre de la playlist
function peekNext(cur){
  const free = other(cur);
  const q = free.queue.find(t => lib.includes(t)) || cur.queue.find(t => lib.includes(t));
  if (q) return q;
  const i = nextIndexAfter(cur.item); return i >= 0 ? lib[i] : null;
}
function takeNext(cur){
  const free = other(cur);
  for (const d of [free, cur]){
    while (d.queue.length){ const t = d.queue.shift(); if (lib.includes(t)){ renderQueue(d); saveQueues(); return t; } }
    renderQueue(d);
  }
  const i = nextIndexAfter(cur.item); return i >= 0 ? lib[i] : null;
}
async function queueNext(cur, free){
  const t = takeNext(cur);
  if (!t){ endOfList = true; return; }
  endOfList = false;
  await loadItem(lib.indexOf(t), free.id);
  replanIfNeeded();
}
// Hors auto mix : quand un son se termine, la platine charge le suivant de sa file (prêt, à l'arrêt)
function onTrackEnd(d){
  if (auto || !d.queue.length) return;
  const t = d.queue.shift(); renderQueue(d); saveQueues();
  if (lib.includes(t)) loadItem(lib.indexOf(t), d.id);
}
function renderQueue(d){
  const ul = $(`${d.id}-qlist`); if (!ul) return;
  d.queue = d.queue.filter(t => lib.includes(t));
  ul.innerHTML = d.queue.length ? d.queue.map((t, i) => `<li><span class="qn">${i + 1}</span><span class="qt" data-qd="${d.id}" data-qi="${i}" title="Charger maintenant">${esc(t.name)}</span><button data-qx="${d.id}" data-qi="${i}" aria-label="Retirer de la file">×</button></li>`).join('')
    : `<li class="qempty">Ajoute les prochains sons : ils se chargeront ici, dans l'ordre.</li>`;
}
function saveQueues(){ idb('samples', 'readwrite', st => st.put({A: decks.A.queue.map(t => t.id).filter(Boolean), B: decks.B.queue.map(t => t.id).filter(Boolean)}, '__queues')).catch(() => {}); }
document.addEventListener('click', e => {
  const x = e.target.closest('[data-qx]');
  if (x){ const d = decks[x.dataset.qx]; d.queue.splice(+x.dataset.qi, 1); renderQueue(d); saveQueues(); return; }
  const q = e.target.closest('[data-qd]');
  if (q){
    const d = decks[q.dataset.qd], t = d.queue[+q.dataset.qi];
    if (d.playing){ toast(`La platine ${d.id} joue : ce son se chargera quand elle sera libre.`); return; }
    d.queue.splice(+q.dataset.qi, 1); renderQueue(d); saveQueues(); loadItem(lib.indexOf(t), d.id);
  }
});
function setAuto(on){
  auto = on;
  $('auto').classList.toggle('on', on); $('auto').setAttribute('aria-pressed', String(on));
  if (!on){ if (plan && !plan.scheduled) plan = null; return; }
  const playing = Object.values(decks).filter(d => d.playing);
  if (playing.length === 2){ toast('Les deux platines tournent : arrête-en une pour lancer le Smart Mix.'); setAuto(false); return; }
  let cur = playing[0];
  if (!cur){
    cur = decks.A.buffer ? decks.A : decks.B;
    if (!cur.buffer){ toast('Charge un morceau pour commencer.'); setAuto(false); return; }
    cur.ctl.vol.set(100); xfCtl.set(cur.id === 'A' ? 0 : 100); cur.play();
  }
  const free = other(cur);
  if (free.buffer && free.item !== cur.item){ replanIfNeeded(); toast(`Smart Mix : ${free.item.name} démarrera à son début sur la fin de ${cur.item.name}.`, 3600); }
  else queueNext(cur, free);
}
$('auto').addEventListener('click', () => setAuto(!auto));
document.querySelectorAll('#lenseg .dbtn').forEach(b => b.addEventListener('click', () => {
  transBeats = +b.dataset.b;
  document.querySelectorAll('#lenseg .dbtn').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  if (plan && !plan.scheduled){ const one = plan.oneShot; plan = makePlan(plan.o, plan.n, one); if (plan) plan.oneShot = one; }
}));

/* ---------- Playlist, réglages ---------- */
const lib = [];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addFiles(files, after){
  const items = files.map(f => ({id: newId(), name: f.name.replace(/\.[^.]+$/, ''), file: f, buffer: null, bpm: 0}));
  const at = after && lib.indexOf(after) >= 0 ? lib.indexOf(after) + 1 : lib.length;
  lib.splice(at, 0, ...items);
  items.forEach(saveTrack); saveOrder();
  if (auto && endOfList){ const cur = Object.values(decks).find(d => d.playing); if (cur) queueNext(cur, other(cur)); }
  return at;
}
function renderLib(){
  const cur = Object.values(decks).find(d => d.playing);
  $('dlist').innerHTML = lib.map((t, i) => `<li class="${cur && cur.item === t ? 'now' : ''}">
    <span class="i">${i + 1}</span>
    <span class="n">${esc(t.name)}</span>
    <span class="m">${t.bpm ? t.bpm.toFixed(1) + ' BPM' : '— BPM'}</span>
    <span class="m">${t.struct ? 'drop ' + fmt(t.struct.drop, 0) : 'à analyser'}</span>
    <button class="dbtn" data-up="${i}" aria-label="Monter dans la playlist" ${i === 0 ? 'disabled' : ''}>↑</button>
    <button class="dbtn" data-del="${i}" aria-label="Retirer de la playlist">✕</button>
    <button class="dbtn a" data-i="${i}" data-to="A" aria-label="Charger sur la platine A">A</button>
    <button class="dbtn b" data-i="${i}" data-to="B" aria-label="Charger sur la platine B">B</button>
  </li>`).join('') + '<li class="dnote">Le Smart Mix suit d\'abord les files « À suivre », puis l\'ordre de cette liste. Les morceaux importés restent gardés dans l\'appli sur ce téléphone, rien n\'est envoyé sur internet.</li>';
}

function applySkin(name){
  if (!SKIN_LCD[name]) name = 'neon';
  document.body.dataset.skin = name;
  [C.lcd, C.wave] = SKIN_LCD[name];
  Object.values(decks).forEach(d => d.overDirty = true);
  document.querySelectorAll('.skin').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.skin === name)));
  try { localStorage.setItem('wartek-skin', name); } catch(e){}
}
document.querySelectorAll('.skin').forEach(b => b.addEventListener('click', () => { applySkin(b.dataset.skin); $('themes').hidden = true; }));
function openPanel(name){ if (name === 'drawer') renderLib(); $(name).hidden = false; }
document.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openPanel(b.dataset.open); });
$('route').addEventListener('click', () => openPanel('settings'));
document.querySelectorAll('.drawer').forEach(dr => {
  dr.addEventListener('pointerdown', e => { if (e.target === dr) dr.hidden = true; });
  dr.querySelector('[data-close]').addEventListener('click', () => dr.hidden = true);
});
$('dlist').addEventListener('click', e => {
  const up = e.target.closest('button[data-up]');
  if (up){ const i = +up.dataset.up; if (i > 0){ [lib[i-1], lib[i]] = [lib[i], lib[i-1]]; renderLib(); saveOrder(); } return; }
  const del = e.target.closest('button[data-del]');
  if (del){
    const i = +del.dataset.del, t = lib[i];
    const on = Object.values(decks).find(d => d.item === t);
    if (on && on.playing){ toast('Ce morceau joue : arrête-le avant de le retirer.'); return; }
    if (on){ if (plan && (plan.n === on || plan.o === on)) plan = null; on.unload(); }
    lib.splice(i, 1); renderLib(); Object.values(decks).forEach(renderQueue);
    if (t.id){ idb('tracks', 'readwrite', st => st.delete(t.id)).catch(() => {}); saveOrder(); }
    return;
  }
  const b = e.target.closest('button[data-i]'); if (b){ $('drawer').hidden = true; loadItem(+b.dataset.i, b.dataset.to); }
});
$('lib-file').addEventListener('change', e => { const files = [...e.target.files]; e.target.value = ''; if (files.length){ addFiles(files); renderLib(); } });
document.querySelectorAll('.opt').forEach(o => o.addEventListener('click', () => { if (!o.disabled){ setRoute(o.dataset.mode); hpHintShown = true; } }));
if (!document.documentElement.requestFullscreen) $('fs').hidden = true;
$('fs').addEventListener('click', async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); $('settings').hidden = true; } catch(e){ toast('Plein écran indisponible ici.'); } });

const decode = ab => new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej));
async function loadItem(i, deckId){
  const t = lib[i], d = decks[deckId];
  if (!t) return;
  if (d.playing){ toast(`La platine ${deckId} joue : mets-la en pause avant de charger.`); return; }
  if (plan && plan.n === d && !plan.scheduled) plan = null;
  d.loading = t.name;
  try {
    if (!t.buffer) t.buffer = await decode(await t.file.arrayBuffer());
    if (!t.bpm){ const r = await analyzeBpm(t.buffer); t.bpm = r.bpm; t.firstBeat = r.firstBeat; t.start = r.start; t.env = r.env; t.envRate = r.envRate;
      if (t.markers && t.markers.kick != null){ t.firstBeat = t.start = t.markers.kick; } }
    d.load(t);
    d.ctl.lo.set(0); d.ctl.filt.set(0);
    replanIfNeeded();
  } catch(err){
    toast('Ce fichier n\'a pas pu être lu. Essaie un MP3, WAV ou M4A.');
  }
  d.loading = null;
}

const dpr = () => Math.min(1.5, window.devicePixelRatio || 1);
let sizeEpoch = 0; addEventListener('resize', () => sizeEpoch++); setTimeout(() => sizeEpoch++, 1500); try { document.fonts.ready.then(() => sizeEpoch++); } catch(e){} addEventListener('orientationchange', () => setTimeout(() => sizeEpoch++, 250));
function fit(c){
  if (c._ep === sizeEpoch && c.width > 1) return false;
  c._ep = sizeEpoch;
  const r = c.getBoundingClientRect(), k = dpr();
  const w = Math.max(1, Math.round(r.width * k)), h = Math.max(1, Math.round(r.height * k));
  if (c.width !== w || c.height !== h){ c.width = w; c.height = h; return true; }
  return false;
}
const deckColor = d => d.id === 'A' ? C.a : C.b;

function drawZoom(d){
  const c = d.ui.zoom; fit(c); const g = c.getContext('2d'); const W = c.width, H = c.height, u = H / 160;

  if (!d.peaks) return;

  const pos = d.pos(), pps = W / ZOOM_SPAN, t0 = pos - ZOOM_SPAN / 2;
  if (d.bpm){
    const bl = d.beatLen;
    for (let k = Math.ceil((t0 - d.firstBeat) / bl); ; k++){
      const t = d.firstBeat + k * bl; if (t > t0 + ZOOM_SPAN) break;
      const x = Math.round((t - t0) * pps), down = mod(k, 4) === 0;
      g.fillStyle = down ? 'rgba(32,230,232,.35)' : 'rgba(32,230,232,.1)';
      g.fillRect(x, top, down ? 2 * u : u, h);
    }
  }
  const {hi, lo, rms} = d.peaks, col = deckColor(d);
  for (let x = 0; x < W; x++){
    let b0 = Math.floor((t0 + x / pps) * RES), b1 = Math.floor((t0 + (x + 1) / pps) * RES);
    if (b1 <= b0) b1 = b0 + 1;
    if (b1 <= 0 || b0 >= hi.length) continue;
    b0 = Math.max(0, b0); b1 = Math.min(hi.length, b1);
    let mh = 0, ml = 0, mr = 0; for (let b = b0; b < b1; b++){ if (hi[b] > mh) mh = hi[b]; if (lo[b] > ml) ml = lo[b]; if (rms[b] > mr) mr = rms[b]; }
    const past = x < W / 2;
    g.globalAlpha = past ? 0.2 : 0.35; g.fillStyle = C.wave; const hh = mh * h * 0.47; g.fillRect(x, mid - hh, 1, hh * 2);
    g.globalAlpha = past ? 0.45 : 0.95; const rh = Math.pow(mr, 1.4) * h * 0.47; g.fillRect(x, mid - rh, 1, rh * 2);
    g.globalAlpha = past ? 0.5 : 1; g.fillStyle = col; const lh = Math.pow(ml, 1.3) * h * 0.47; g.fillRect(x, mid - lh, 1, lh * 2);
  }
  g.globalAlpha = 1;
  const st = d.item && d.item.struct;
  const k2 = plan && plan.o === d ? plan.oldStart : null;
  if (st) [[d.firstBeat, '#20e6e8', 'KICK'], [st.drop, C.go, 'B1'], [st.lastBass, '#e5ff3d', 'B2'], [st.outro, C.alert, 'FIN'], [k2, '#ff4fd8', 'K2'], [plan && plan.o === d ? plan.cut : null, '#ffb13d', 'COUPE']].filter(x => x[0] != null).forEach(([tm, col, lb]) => {
    const x = (tm - t0) * pps; if (x < 0 || x > W) return;
    g.fillStyle = col; g.fillRect(x - u, top, 2 * u, h);
    g.font = `${Math.round(11 * u)}px ${LCD_FONT}`; g.textBaseline = 'bottom'; g.fillText(lb, x + 3 * u, top + h);
  });
  g.fillStyle = C.alert; g.fillRect(Math.round(W / 2 - u), top, 2 * u, h);
}

function drawOver(d){
  const c = d.ui.over; const resized = fit(c); const g = c.getContext('2d'); const W = c.width, H = c.height;
  g.fillStyle = C.lcd; g.fillRect(0, 0, W, H);
  if (!d.peaks) return;
  if (resized || d.overDirty || !d.overImg){
    const off = d.overImg || document.createElement('canvas'); off.width = W; off.height = H;
    const o = off.getContext('2d'); o.fillStyle = C.lcd; o.fillRect(0, 0, W, H);
    // Énergie moyenne (RMS) plutôt que les crêtes : les intros, breaks et drops ressortent
    const {lo, rms} = d.peaks, n = rms.length, tickH = Math.round(H * 0.16), wh = H - tickH, mid = wh / 2;
    const cols = []; let top = 0;
    for (let x = 0; x < W; x++){
      const b0 = Math.floor(x / W * n), b1 = Math.max(b0 + 1, Math.floor((x + 1) / W * n));
      let sr = 0, sl = 0, c = 0; for (let b = b0; b < b1 && b < n; b++){ sr += rms[b]; sl += lo[b]; c++; }
      const r = c ? sr / c : 0, l = c ? sl / c : 0; cols.push([r, l]); if (r > top) top = r;
    }
    const k = top > 0 ? 1 / top : 1;
    cols.forEach(([r, l], x) => {
      const e = Math.pow(r * k, 2.2), lb = Math.pow(Math.min(1, l * k), 2.2);
      o.globalAlpha = 0.9; o.fillStyle = C.wave; o.fillRect(x, mid - e * mid * 0.94, 1, e * wh * 0.94);
      o.globalAlpha = 1; o.fillStyle = deckColor(d); o.fillRect(x, mid - lb * e * mid * 0.94, 1, lb * e * wh * 0.94);
    });
    o.globalAlpha = 1;
    o.fillStyle = '#0d1d2e'; o.fillRect(0, wh, W, tickH);
    o.font = `${Math.round(tickH * 0.8)}px ${LCD_FONT}`; o.textBaseline = 'middle'; o.textAlign = 'left';
    for (let t = 30; t < d.duration; t += 30){
      const x = Math.round(t / d.duration * W), minute = t % 60 === 0;
      o.fillStyle = minute ? '#4fb3b8' : '#1f4a4e'; o.fillRect(x, wh, Math.max(1, dpr()), minute ? tickH : tickH / 2);
      if (minute && x + 30 * dpr() < W) o.fillText(` ${t / 60}:00`, x, wh + tickH / 2);
    }
    const st = d.item.struct, u = H / 80;
    o.fillStyle = 'rgba(32,230,232,.35)';
    const ph32 = 32 * d.beatLen, p0 = st.phrase0 ?? d.firstBeat;
    for (let t = p0 - Math.floor((p0 - d.firstBeat) / ph32) * ph32; t < d.duration; t += ph32) o.fillRect(Math.round(t / d.duration * W), 0, Math.max(1, u), H * 0.18);
    o.font = `${Math.round(H * 0.16)}px ${LCD_FONT}`; o.textBaseline = 'top';
    [[d.firstBeat, '#20e6e8', 'K'], [st.drop, C.go, 'B1'], [st.lastBass, '#e5ff3d', 'B2'], [st.outro, C.alert, 'F']].filter(x => x[0] != null).forEach(([t, col, lb]) => {
      const x = Math.round(t / d.duration * W); o.fillStyle = col; o.fillRect(x, 0, 2 * u, H);
      o.fillRect(x, H * 0.2, H * 0.08 * (lb.length + 1), H * 0.18); o.fillStyle = '#031216'; o.fillText(lb, x + H * 0.03, H * 0.21);
    });
    d.overImg = off; d.overDirty = false;
  }
  g.drawImage(d.overImg, 0, 0);
  const u = Math.max(1, H / 80);
  if (plan && plan.o === d){
    const x0 = plan.oldStart / d.duration * W, x1 = (plan.oldStart + plan.totalBeats * d.beatLen) / d.duration * W, xp = plan.P / d.duration * W;
    g.fillStyle = 'rgba(61,255,176,.2)'; g.fillRect(x0, 0, x1 - x0, H);
    g.fillStyle = '#ffffff'; g.fillRect(Math.round(xp - u), 0, 2 * u, H);
    const xk = plan.oldStart / d.duration * W;
    g.fillStyle = '#ff4fd8'; g.fillRect(Math.round(xk - u), 0, 2 * u, H);
    g.font = `${Math.round(H * 0.16)}px ${LCD_FONT}`; g.textBaseline = 'top';
    g.fillRect(xk, H * 0.62, H * 0.24, H * 0.18); g.fillStyle = '#031216'; g.fillText('K2', xk + H * 0.02, H * 0.63);
    const xc = plan.cut / d.duration * W;
    g.fillStyle = '#ffb13d'; g.fillRect(Math.round(xc - u), 0, 2 * u, H);
    g.fillRect(xc, H * 0.62, H * 0.16, H * 0.18); g.fillStyle = '#031216'; g.fillText('C', xc + H * 0.03, H * 0.63);
  }
  const px = d.duration ? d.pos() / d.duration * W : 0;
  g.fillStyle = 'rgba(5,10,16,.45)'; g.fillRect(0, 0, px, H);
  g.fillStyle = C.fg; g.fillRect(Math.round(px - u), 0, 2 * u, H);
}

function meterVal(level){ return clamp((20 * Math.log10(level + 1e-6) + 42) / 42, 0, 1); }
function drawVMeter(c, level){
  fit(c); const g = c.getContext('2d'); const W = c.width, H = c.height;
  g.fillStyle = '#040505'; g.fillRect(0, 0, W, H);
  const n = 14, gap = H * 0.014, h = (H - gap * (n - 1)) / n, on = Math.round(meterVal(level) * n);
  for (let i = 0; i < n; i++){
    g.fillStyle = i >= n - 2 ? C.alert : i >= n - 5 ? C.cue : C.go;
    g.globalAlpha = i < on ? 1 : 0.12; g.fillRect(0, H - (i + 1) * h - i * gap, W, h);
  }
  g.globalAlpha = 1;
}
function drawMasterMeters(m, h){
  const c = $('mmeter'); fit(c); const g = c.getContext('2d'); const W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  const rowH = (H - 8) / 3, lab = 30 * dpr();
  g.font = `${Math.round(rowH * 0.9)}px ${LCD_FONT}`; g.textBaseline = 'middle'; g.fillStyle = '#4fb3b8';
  [['M', m], ['H', h]].forEach(([t, l], r) => {
    const y = r * (rowH + 4);
    g.fillStyle = r ? C.cue : '#4fb3b8'; g.fillText(t, 0, y + rowH / 2);
    const n = 24, gap = 2, w = (W - lab - gap * (n - 1)) / n, on = Math.round(meterVal(l) * n);
    for (let i = 0; i < n; i++){
      g.fillStyle = i >= n - 3 ? C.alert : i >= n - 7 ? C.cue : C.go;
      g.globalAlpha = i < on ? 1 : 0.14; g.fillRect(lab + i * (w + gap), y, w, rowH);
    }
    g.globalAlpha = 1;
  });
  // Réduction automatique par bande (0 à -12 dB)
  const y = 2 * (rowH + 4), seg = (W - lab) / 3;
  g.fillStyle = autoLevel ? '#20e6e8' : '#1f4a4e'; g.fillText('AL', 0, y + rowH / 2);
  [['B', cLow], ['M', cMid], ['A', cHigh]].forEach(([t, c], i) => {
    const x0 = lab + i * seg, red = autoLevel ? Math.min(12, -c.reduction) : 0, bw = seg - 22 * dpr();
    g.fillStyle = '#4fb3b8'; g.fillText(t, x0, y + rowH / 2);
    g.fillStyle = '#0b2226'; g.fillRect(x0 + 12 * dpr(), y, bw, rowH);
    g.fillStyle = red > 6 ? C.alert : C.cue; g.fillRect(x0 + 12 * dpr(), y, bw * red / 12, rowH);
  });
}
function peakOf(an, buf){ an.getFloatTimeDomainData(buf); let p = 0; for (let i = 0; i < buf.length; i++){ const v = Math.abs(buf[i]); if (v > p) p = v; } return p; }
const mBuf = new Float32Array(1024), hBuf = new Float32Array(1024); let mLevel = 0, hLevel = 0;
const setText = (el, t) => { if (el.textContent !== t) el.textContent = t; };

function updateLcd(){
  let a, b;
  const cur = Object.values(decks).find(d => d.playing && d.t0 <= ctx.currentTime);
  if (plan){
    const now = ctx.currentTime, id = `${plan.o.id}→${plan.n.id}`, beat = plan.o.beatLen / plan.o.rate;
    if (!plan.scheduled || now < plan.T0){ a = `MIX ${id} : ${plan.n.id} DÉMARRE DANS ${fmt(planStartReal(plan) - now)}`; b = plan.useB2 ? `K de ${plan.n.id} sur K2 de ${plan.o.id} (${plan.Lp} temps) → B1 sur B2` : plan.why ? `${plan.why} : départ sur un bloc de 32` : `Départ sur le temps 1 d'un bloc de 32 · swap ${plan.Lp ? 'après ' + plan.Lp + ' temps' : 'direct'}`; }
    else if (now < plan.tDrop){ a = `${plan.n.id} ENTRE · SWAP DANS ${Math.ceil((plan.tDrop - now) / beat)} T`; b = `${plan.cfx || 'CFX'} · basses ${plan.n.id} coupées`; }
    else if (now < plan.tDrop + 4 * beat){ a = `BASS SWAP → ${plan.n.id}`; b = `Basses ${plan.o.id} coupées net`; }
    else if (now < plan.tFade){ a = `MIX ${id} · LES DEUX ENSEMBLE`; b = `${plan.cutBar ? 'Break de ' + plan.n.id + ' : coupe de ' + plan.o.id : plan.o.id + ' commence à s\'effacer'} dans ${Math.ceil((plan.tFade - now) / beat)} temps`; }
    else { a = `${plan.o.id} S'EFFACE`; b = `Fin de ${plan.o.id} sur le point C dans ${Math.max(0, Math.ceil((plan.tEnd - now) / beat))} temps`; }
    if (!plan.synced) b = 'Tempos trop éloignés : mix court';
    if (plan.manual) b = 'À toi de finir le passage';
  } else if (!auto){ a = 'SMART MIX OFF'; b = cur ? `En cours : ${cur.item.name}` : 'Lance un son, puis SMART MIX'; }
  else if (endOfList){ a = 'FIN DE LA PLAYLIST'; b = 'Ajoute des morceaux'; }
  else { a = 'SMART MIX ON'; b = 'Prépare le son suivant…'; }
  if (!plan && cur && auto){ const n = peekNext(cur); b = `Suivant : ${n ? n.name : '—'}`; }
  if (lockInfo && ctx.currentTime - lockInfo.t < 1.6) b = lockInfo.txt + ' · ' + b;
  setText($('ml1'), a); setText($('ml2'), b);
}

let lastDraw = 0;
// Calage automatique : on compare les kicks réellement joués par les deux platines.
// S'ils ne tombent pas ensemble, petit coup de pitch sur le son qui entre ; une fois calé, on ne touche plus.
let lastLock = 0, lockInfo = null;
const envAt = (t, sec) => { const x = sec * t.envRate, i = Math.floor(x), f = x - i, e = t.env; return i >= 0 && i + 1 < e.length ? e[i] * (1 - f) + e[i + 1] * f : 0; };
function phaseLock(){
  const now = ctx.currentTime; if (now - lastLock < 1) return; lastLock = now;
  const A = decks.A, B = decks.B;
  if (!A.playing || !B.playing || !A.item?.env || !B.item?.env || A.nudging || B.nudging) return;
  const since = now - Math.max(A.t0, B.t0, A.nudgeEnd || 0, B.nudgeEnd || 0);   // fenêtre sans coup de pitch
  if (since < 0.6) return;
  if (Math.abs(A.bpm * A.rate - B.bpm * B.rate) > 0.08) return;
  const master = plan && plan.scheduled ? plan.o : (A.t0 <= B.t0 ? A : B), slave = other(master);
  const beat = 60 / (master.bpm * master.rate), W = Math.min(8 * beat, since - 0.05), step = 0.002;
  const N = Math.floor(W / step), L = Math.floor(0.48 * beat / step); if (N < 60) return;
  const pm = master.pos(), ps = slave.pos(), a = new Float32Array(N), bx = new Float32Array(N + 2 * L);
  for (let k = 0; k < N; k++){ const back = (N - k) * step; a[k] = envAt(master.item, pm - back * master.rate); }
  for (let k = -L; k < N + L; k++){ const back = (N - k) * step; bx[k + L] = envAt(slave.item, ps - back * slave.rate); }
  let best = -1, bj = 0, sum = 0;
  for (let j = -L; j <= L; j++){ let c = 0; for (let k = 0; k < N; k++) c += a[k] * bx[k + j + L]; sum += c; if (c > best){ best = c; bj = j; } }
  const mean = sum / (2 * L + 1); if (best < 1.6 * mean || best <= 0) return;   // pas assez de kicks nets pour juger
  const late = bj * step;   // > 0 : le son qui entre est en retard
  if (Math.abs(late) < 0.003){ lockInfo = {t: now, txt: 'CALÉ ✓'}; return; }
  // Coup de pitch comme un DJ : 4 % maximum, plus long si le décalage est grand
  slave.nudge(late, Math.max(0.3, Math.abs(late) / 0.04));
  lockInfo = {t: now, txt: `CALAGE ${slave.id} ${late > 0 ? '+' : ''}${Math.round(late * 1000)} ms`};
}

function frame(now){
  if (now - lastDraw < 32){ autoTick(); requestAnimationFrame(frame); return; }
  lastDraw = now;
  autoTick();
  phaseLock();
  for (const d of Object.values(decks)){
    drawZoom(d); drawOver(d);
    const has = !!d.buffer;
    d.ui.empty.hidden = has && !d.loading;
    setText(d.ui.empty, d.loading ? 'ANALYSE…' : 'LOAD AUDIO HERE');
    setText(d.ui.title, has ? d.item.name : '');
    d.ui.time.textContent = has ? '-' + fmt(d.duration - d.pos()) : '';
    setText(d.ui.fname, d.loading || (has ? d.item.name : 'Aucun morceau'));
    setText(d.ui.bpm, d.bpm ? (d.bpm * d.rate).toFixed(2) : '—');
    const o = other(d);
    d.ui.sync.classList.toggle('lit', !!(d.bpm && o.bpm && Math.abs(d.bpm * d.rate - o.bpm * o.rate) < 0.05));
    const pl = d.ui.play, on = d.playing;
    if (pl.classList.contains('on') !== on){ pl.classList.toggle('on', on); pl.querySelector('.face').innerHTML = on ? ICON_PAUSE : ICON_PLAY; setText(d.ui.playlbl, on ? 'Pause' : 'Start mix'); }
    pl.classList.toggle('idle', !has);
    pl.classList.toggle('wait', d.playing && d.t0 > ctx.currentTime);
    const pub = isPublic(d), air = d.ui.air;
    const label = pub ? 'EN PUBLIC' : (d.cueOn && d.playing ? 'CASQUE SEUL' : (d.cueOn ? 'CASQUE' : ''));
    setText(air, label); air.classList.toggle('pub', pub); air.classList.toggle('hp', !pub && d.cueOn);
    d.level = Math.max(peakOf(d.an, d.anBuf), d.level * 0.9);
    drawVMeter($(`${d.id}-meter`), d.level);
  }
  mLevel = Math.max(peakOf(masterAn, mBuf), mLevel * 0.9);
  hLevel = Math.max(peakOf(hpAn, hBuf), hLevel * 0.9);
  drawMasterMeters(mLevel, hLevel);
  updateLcd();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
let savedSkin = 'neon'; try { savedSkin = localStorage.getItem('wartek-skin') || 'neon'; } catch(e){}
applySkin(savedSkin);

/* ---------- Démarrage : samples + trois pistes démo ---------- */
(async () => {
  try {
    const samples = await makeSamples();
    for (const d of Object.values(decks)){ d.samples = samples.map(s => ({...s})); samples.forEach((s, i) => $(`${d.id}-padn${i}`).textContent = s.name); }
  } catch(e){}
  for (const d of Object.values(decks)) for (let i = 0; i < 4; i++){
    try {
      const rec = await idb('samples', 'readonly', st => st.get(`${d.id}${i}`));
      if (rec && rec.blob){ d.samples[i] = {name: rec.name, buffer: await decode(await rec.blob.arrayBuffer())}; $(`${d.id}-padn${i}`).textContent = rec.name; $(`${d.id}-padset${i}`).classList.add('custom'); }
    } catch(e){}
  }
  let saved = [];
  try {
    const recs = await idb('tracks', 'readonly', st => st.getAll()) || [];
    const order = await idb('samples', 'readonly', st => st.get('__order')) || [];
    recs.sort((a, b) => (order.indexOf(a.id) + 1 || 1e9) - (order.indexOf(b.id) + 1 || 1e9));
    saved = recs.map(r => ({id: r.id, name: r.name, file: r.blob, buffer: null, bpm: 0, markers: r.markers || null}));
  } catch(e){}
  const specs = [
    {name: 'Démo · Nuit Chaude', bpm: 122, style: 1, notes: [55, 55, 65.41, 49]},
    {name: 'Démo · Ligne Bleue', bpm: 126, style: 2},
    {name: 'Démo · Quai 9', bpm: 124, style: 3, notes: [61.74, 61.74, 73.42, 55]}
  ];
  try {
    const bufs = await Promise.all(specs.map(makeDemo));
    specs.forEach((s, i) => {
      const t = {name: s.name, buffer: bufs[i], bpm: s.bpm, firstBeat: 0};
      t.peaks = computePeaks(t.buffer);
      const bar = 240 / s.bpm;
      t.struct = {drop: 8 * bar, outro: 40 * bar, dropBar: 8, outroBar: 40, nb: 48, phrase0: 0, phraseBar: 0};
      lib.push(t);
    });
    lib.unshift(...saved);
    try {
      const qs = await idb('samples', 'readonly', st => st.get('__queues'));
      if (qs) for (const id of ['A', 'B']){ decks[id].queue = (qs[id] || []).map(x => saved.find(t => t.id === x)).filter(Boolean); renderQueue(decks[id]); }
    } catch(e){}
    if (saved.length){ loadItem(0, 'A'); if (lib[1]) loadItem(1, 'B'); }
    else { decks.A.load(lib[0]); decks.B.load(lib[1]); }
    xfCtl.set(0);
  } catch(e){ console.error('demo', e && e.message); }
  Object.values(decks).forEach(renderQueue);
})();
})();
</script>

<script>
// Appli installable (PWA) : hors ligne + mise à jour automatique
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
// En mode appli ou plein écran : on bloque l'écran en paysage
(function(){
  const lock = () => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch(e){} };
  if (window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) lock();
  document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) lock(); });
})();
