<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>WARTEK MACHINE</title>
<meta name="description" content="WARTEK MACHINE : console DJ deux platines avec Smart Mix automatique.">
<meta name="theme-color" content="#030709">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WARTEK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;overscroll-behavior:none}
body{font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Exo+2:wght@400;500;600;700&family=Black+Ops+One&family=VT323&family=Righteous&family=Monoton&family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: module 1600×640 mis à l'échelle de l'écran. Panneau A | table de mixage | panneau B, comme le visuel de référence */
:root{
  color-scheme: dark;
  --bg:#060708;
  --panel:#24262a;
  --panel-lo:#1a1b1e;
  --inset:#141518;
  --lcd:#0a1522;
  --lcd-fg:#9fd4ff;
  --fg:#e9e9e6;
  --mute:#8d9096;
  --a:#f2a03d;
  --b:#52b4e2;
  --go:#3ddc5a;
  --blue:#2e8cff;
  --red:#ff3d3d;
  --orange:#ff7a1a;
  --yellow:#ffd21a;
  --cue:#ff8a1f;
  --alert:#e8604c;
  --font-ui:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-lcd:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,label{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.viewport{position:fixed;inset:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:max(6px, env(safe-area-inset-top, 0px)) max(6px, env(safe-area-inset-bottom, 0px))}
.fitbox{position:relative;width:100%;height:100%}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:744px;transform:translate(-50%,-50%) scale(var(--s,0.5));
  display:grid;grid-template-columns:1fr 288px 1fr;grid-template-rows:94px 1fr;gap:10px;touch-action:none}

/* Panneaux de platine */
.panel{background:linear-gradient(180deg,#2e3034,var(--panel) 30%,var(--panel-lo));border:1px solid #3a3c41;border-radius:10px;
  box-shadow:0 18px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);display:grid;grid-template-rows:42px 1fr;min-width:0;overflow:hidden}
.phead{display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #121315;background:linear-gradient(#303236,#26282b)}
.phead h2{margin:0;font-size:24px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.phead .tag{width:26px;height:26px;border-radius:5px;background:var(--deck);color:#111;font-weight:700;font-size:18px;display:grid;place-items:center}
.air{font-size:13px;font-weight:700;letter-spacing:.12em;padding:3px 8px;border-radius:4px;border:1px solid transparent;color:var(--mute)}
.air.pub{color:#08130b;background:var(--go)}
.air.hp{color:#fff;background:var(--blue)}
.phead .sp{flex:1}
.phead .ver{font-size:14px;color:var(--mute)}
.ico{width:28px;height:28px;border-radius:4px;border:1px solid #111;background:#34363b;display:grid;place-items:center;font-size:18px;line-height:1;padding:0}
.ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}

.pbody{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:10px;padding:10px;min-height:0}
.sec{background:linear-gradient(180deg,#27292d,#1f2124);border:1px solid #34363b;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);min-height:0}
.mainsec{display:grid;grid-template-rows:26px 1fr 132px;gap:6px;padding:8px 12px 10px}
.sechead{display:flex;justify-content:space-between;font-size:19px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:0 6px}
.loadgrid{display:grid;grid-template-columns:1fr 90px 124px;grid-template-rows:118px 1fr;grid-template-areas:"scr q q" "scr s p";gap:10px;min-height:0;border-bottom:1px solid #34363b;padding-bottom:10px}
.screens{grid-area:scr;display:grid;grid-template-rows:1fr 108px;gap:10px;min-width:0;min-height:0}
.lcd{position:relative;background:var(--lcd);border-radius:6px;border:1px solid #000;box-shadow:inset 0 0 0 2px #303338,inset 0 0 24px rgba(0,0,0,.8);min-height:0;min-width:0;overflow:hidden}
.lcd canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--font-lcd);font-size:24px;color:var(--lcd-fg);letter-spacing:.06em;text-shadow:0 0 10px rgba(80,170,255,.6);pointer-events:none;padding-bottom:28px}
.lcdinfo{position:absolute;left:10px;right:10px;top:6px;display:flex;justify-content:space-between;gap:10px;font-family:var(--font-lcd);font-size:15px;color:var(--lcd-fg);pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.9)}
.lcdinfo b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.browse{position:absolute;right:8px;bottom:8px;height:36px;padding:0 16px;border-radius:5px;border:1px solid #000;background:linear-gradient(#4a4c52,#2c2e32);box-shadow:0 0 0 1px #5a5d63;font-size:16px;font-weight:600;letter-spacing:.06em;display:grid;place-items:center;cursor:pointer}
.fname{position:absolute;left:0;right:0;top:0;height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:15px;color:var(--fg);background:rgba(255,255,255,.04);border-bottom:1px solid #22344a;z-index:1}
.fname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fname button{border:0;background:none;padding:0 2px;font-size:18px;color:var(--fg);line-height:1}
.fname > span:first-child{flex:1;min-width:0}
.fname .mk{display:flex;gap:3px;margin:0 4px;flex:none}
.fname .mk button{font-family:var(--font-lcd);font-size:11px;height:18px;min-width:18px;padding:0 3px;border-radius:3px;border:1px solid currentColor;line-height:16px}
.fname .mk [data-mk="kick"]{color:#20e6e8}.fname .mk [data-mk="bass"]{color:#3dffb0}.fname .mk [data-mk="bass2"]{color:#e5ff3d}.fname .mk [data-mk="out"]{color:#ff3d6e}
.lcd.small canvas{top:24px;height:calc(100% - 24px);cursor:pointer}

.synccol,.playcol{display:grid;justify-items:center;align-content:center;gap:6px;text-align:center}
.synccol{grid-area:s}.playcol{grid-area:p}
.queue{grid-area:q;background:var(--lcd);border:1px solid rgba(32,230,232,.32);border-radius:6px;display:grid;grid-template-rows:28px 1fr;overflow:hidden;min-width:0;box-shadow:inset 0 0 16px rgba(32,230,232,.08)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 6px 0 10px;border-bottom:1px solid rgba(32,230,232,.2);font-size:15px;font-weight:500;color:var(--lcd-fg)}
.qadd{font-size:13px;font-weight:600;border:1px solid var(--neon);color:var(--neon);border-radius:4px;padding:2px 9px;cursor:pointer;white-space:nowrap;box-shadow:0 0 8px rgba(32,230,232,.3)}
.qlist{list-style:none;margin:0;padding:3px 0;overflow-y:auto;touch-action:pan-y;min-height:0}
.qlist li{display:grid;grid-template-columns:16px 1fr 24px;gap:6px;align-items:center;padding:1px 4px 1px 10px;font-family:var(--font-lcd);font-size:14px;color:var(--lcd-fg);min-width:0}
.qlist li:first-child .qt{color:#fff;text-shadow:0 0 6px rgba(32,230,232,.8)}
.qlist .qn{color:#4fb3b8}
.qt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:0}
.qlist button{border:0;background:none;color:#4fb3b8;font-size:17px;line-height:1;padding:0;height:22px}
.qlist li.qempty{display:block;font-family:var(--font-ui)}
.qempty{padding:8px 10px;font-size:13px;color:#4fb3b8;line-height:1.3}
.cap{font-size:14px;font-weight:600;line-height:1.1;letter-spacing:.02em;text-transform:uppercase}
.cap2{font-size:17px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.syncbtn{width:74px;height:80px;border-radius:8px;border:2px solid #0a0b0d;background:linear-gradient(#1d3046,#122233);display:grid;place-items:center;align-content:center;gap:2px;
  box-shadow:0 0 0 2px #2b4766,inset 0 1px 0 rgba(255,255,255,.08);color:var(--lcd-fg);font-family:var(--font-lcd);font-size:17px;touch-action:manipulation}
.syncbtn svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.syncbtn.lit{box-shadow:0 0 0 2px var(--blue),0 0 18px rgba(46,140,255,.7),inset 0 0 14px rgba(46,140,255,.35);color:#fff}
.startbtn{width:120px;height:120px;border-radius:50%;border:0;padding:0;position:relative;touch-action:manipulation;
  background:radial-gradient(circle at 50% 50%,#2b2d31 0 58%,#0b0c0d 59% 62%,#3b3d42 63% 70%,#1a1b1e 71%);
  box-shadow:0 6px 14px rgba(0,0,0,.7)}
.startbtn::before{content:"";position:absolute;inset:13px;border-radius:50%;border:5px solid #1f5e2c;transition:border-color .15s, box-shadow .15s}
.startbtn .face{position:absolute;inset:22px;border-radius:50%;background:radial-gradient(circle at 45% 35%,#56e66f,#22a83c 60%,#167a2a);display:grid;place-items:center;
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.35),inset 0 4px 8px rgba(255,255,255,.25)}
.startbtn svg{width:40px;height:40px;fill:#0d1a10}
.startbtn.on::before{border-color:var(--go);box-shadow:0 0 22px rgba(61,220,90,.8),inset 0 0 12px rgba(61,220,90,.6)}
.retour{height:30px;padding:0 12px;border-radius:5px;border:1px solid #0a0b0d;background:linear-gradient(#3a3c41,#26282c);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px;touch-action:manipulation}
.retour svg{width:14px;height:14px;fill:currentColor}
.startbtn.wait::before{border-color:var(--yellow);box-shadow:0 0 18px rgba(255,210,26,.7)}
.startbtn.idle .face{filter:saturate(.35) brightness(.7)}
.startbtn:active .face{transform:scale(.97)}

.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end;padding:0 4px}
.padw{display:grid;justify-items:center;gap:6px}
.padlbl{white-space:nowrap;max-width:100%;overflow:hidden;border:1px solid #3a3c41;background:#2a2c30;padding:2px 7px;border-radius:5px;font-size:15px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;display:flex;gap:6px;align-items:center;color:var(--fg);touch-action:manipulation}
.padlbl svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.padlbl.custom{border-color:var(--blue);color:#bcd9ff}
.lcd.big.nofile{cursor:pointer}
.pad{width:96px;height:96px;border-radius:8px;border:2px solid #0a0b0d;position:relative;padding:0;touch-action:none;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--pc) 85%,#fff 15%),var(--pc) 55%,color-mix(in srgb,var(--pc) 60%,#000));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 35%,#000),0 0 14px color-mix(in srgb,var(--pc) 45%,transparent),inset 0 2px 6px rgba(255,255,255,.3);
  display:grid;place-items:center;align-content:center;gap:2px;color:#1a0a0a}
.pad svg{width:34px;height:34px;fill:currentColor}
.pad small{font-size:13px;font-weight:700;letter-spacing:.04em;max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad.hit{box-shadow:0 0 0 3px #fff,0 0 30px var(--pc),inset 0 2px 6px rgba(255,255,255,.5);filter:brightness(1.25)}

.fxsec{display:grid;grid-template-rows:26px 150px 22px 1fr 96px;gap:6px;padding:8px 10px 10px;justify-items:center}
.fxsec .sechead{justify-content:center;font-size:17px;white-space:nowrap;padding:0}
.fxbtns{display:grid;gap:9px;width:100%;align-content:center}
.fxb{height:38px;border-radius:6px;border:1px solid #0a0b0d;background:linear-gradient(#3a3c41,#26282c);font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;touch-action:manipulation;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 3px rgba(0,0,0,.5)}
.fxb[aria-pressed="true"]{background:linear-gradient(#1e5bb0,#174a91);box-shadow:0 0 0 2px var(--blue),0 0 14px rgba(46,140,255,.7);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;justify-items:center}

/* Potards */
.kwrap{display:grid;justify-items:center;gap:2px;position:relative}
.knob{position:relative;width:46px;height:46px;border-radius:50%;touch-action:none;cursor:ns-resize}
.knob .ring{position:absolute;inset:0;border-radius:50%}
.knob .cap{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#53565c,#1c1d20 72%);box-shadow:0 3px 5px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1)}
.knob .cap::after{content:"";position:absolute;left:50%;top:3px;width:3px;height:32%;margin-left:-1.5px;border-radius:2px;background:#fff}
.knob.metal{width:96px;height:96px}
.knob.metal .cap{inset:14px;background:repeating-conic-gradient(from 0deg,#d9dbde 0 6deg,#a9acb1 6deg 12deg);box-shadow:0 6px 10px rgba(0,0,0,.8),inset 0 0 0 3px #6b6e74}
.knob.metal .cap::before{content:"";position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#f4f5f6,#b5b8bc 60%,#8d9095)}
.knob.metal .cap::after{background:#222;top:2px;height:26%;width:4px;margin-left:-2px;z-index:1}
.knob.mid{width:56px;height:56px}
.knob.mid .cap{background:radial-gradient(circle at 40% 30%,#e5e6e8,#a2a5aa 60%,#6e7176)}
.knob.mid .cap::after{background:#1a1a1a}
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks span{position:absolute;font-size:12px;font-weight:600;color:var(--fg);transform:translate(-50%,-50%)}
.klabel{font-size:13px;letter-spacing:.06em;color:var(--fg);font-weight:600;text-transform:uppercase;height:16px;line-height:16px;white-space:nowrap}
.klabel.show{color:var(--lcd-fg);font-family:var(--font-lcd);font-size:13px;letter-spacing:0}

/* Table de mixage */
.mixer{background:linear-gradient(180deg,#1d1e21,#151618);border:1px solid #2e3034;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.6);
  display:grid;grid-template-rows:88px auto 52px 1fr 50px;gap:8px;padding:10px 10px 12px;min-height:0}
.mlcd{overflow:hidden;background:var(--lcd);border-radius:6px;border:1px solid #000;box-shadow:inset 0 0 0 2px #303338;padding:6px 10px;display:grid;grid-template-rows:auto auto 1fr;gap:2px;font-family:var(--font-lcd);color:var(--lcd-fg);min-width:0}
.ml1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml2{font-size:13px;color:#6f9cc2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlcd canvas{width:100%;height:36px;display:block}
.eq{display:grid;grid-template-columns:64px 1fr 64px;row-gap:4px;align-items:center;justify-items:center}
.eq .lab{font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:600}
.cbtns{display:grid;gap:6px;width:100%}
.mini{height:28px;border-radius:4px;border:1px solid #0a0b0d;background:linear-gradient(#34363b,#232528);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;touch-action:manipulation}
.cuerow{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;justify-items:center;gap:4px}
.hpbtn{width:56px;height:46px;border-radius:6px;border:1px solid #0a0b0d;background:linear-gradient(#2c2e32,#1e1f22);display:grid;place-items:center;align-content:center;gap:0;color:var(--cue);touch-action:manipulation;
  box-shadow:inset 0 0 0 2px #4a2a10}
.hpbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.hpbtn b{font-size:14px;line-height:1}
.hpbtn.on{background:linear-gradient(#ff9a3d,#e8700f);color:#1a0d02;box-shadow:0 0 0 2px var(--cue),0 0 16px rgba(255,138,31,.75)}
.route{border:1px solid #3a2a1a;border-radius:5px;padding:4px 6px;text-align:center;font-size:12px;letter-spacing:.06em;color:var(--cue);background:#1b130b;width:100%;line-height:1.15;text-transform:uppercase}
.route b{display:block;color:var(--fg);font-size:13px}
.faders{display:grid;grid-template-columns:64px 1fr 64px;min-height:0;overflow:hidden;justify-items:center}
.mwrap{position:relative;width:8px;height:100%;min-height:0}
.mwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:2px}
.chf{display:grid;grid-template-columns:44px 8px;gap:5px;height:100%;min-height:0;overflow:hidden}
.chf.r{grid-template-columns:8px 44px}
.vmeter{width:8px;height:100%;display:block;border-radius:2px}
.vfader{position:relative;width:44px;height:100%;touch-action:none;cursor:ns-resize}
.vfader::before{content:"";position:absolute;inset:14px 2px;background:repeating-linear-gradient(180deg,#4a4c52 0 2px,transparent 2px 12.5%);opacity:.8}
.vfader .slot{position:absolute;left:50%;top:12px;bottom:12px;width:6px;margin-left:-3px;background:#020203;border-radius:3px}
.vfader .cap,.hfader .cap{position:absolute;border-radius:3px;background:linear-gradient(#5a5c62,#2a2b2f 50%,#141517);box-shadow:0 4px 6px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.14);border:1px solid #000}
.vfader .cap{left:50%;width:40px;height:26px;margin-left:-20px;top:calc(var(--p,0) * (100% - 26px))}
.vfader .cap::after,.hfader .cap::after{content:"";position:absolute;background:#fff}
.vfader .cap::after{left:3px;right:3px;top:50%;height:2px;margin-top:-1px}
.smart{display:grid;justify-items:center;align-content:center;gap:10px}
.smartbtn{width:84px;height:84px;font-size:14px;border-radius:50%;border:2px solid #0a0b0d;background:radial-gradient(circle at 45% 35%,#3a2a1c,#1d140c 70%);color:var(--cue);
  box-shadow:0 0 0 3px #4a2a10,0 3px 6px rgba(0,0,0,.6);font-size:11px;font-weight:700;letter-spacing:.06em;line-height:1.05;touch-action:manipulation}
.smartbtn.on{background:radial-gradient(circle at 45% 35%,#ffb15c,#e8700f 70%);color:#1a0d02;box-shadow:0 0 0 3px var(--cue),0 0 22px rgba(255,138,31,.85)}
.smart .mini{width:100px}
.xrow{display:grid;grid-template-columns:20px 1fr 20px;gap:6px;align-items:center}
.xrow b{text-align:center;font-size:15px}
.hfader{position:relative;height:44px;touch-action:none;cursor:ew-resize}
.hfader::before{content:"";position:absolute;left:20px;right:20px;top:4px;bottom:4px;background:repeating-linear-gradient(90deg,#4a4c52 0 2px,transparent 2px 12.5%);opacity:.6}
.hfader .slot{position:absolute;top:50%;left:12px;right:12px;height:6px;margin-top:-3px;background:#020203;border-radius:3px}
.hfader .cap{top:50%;height:40px;width:24px;margin-top:-20px;left:calc(var(--p,0) * (100% - 24px))}
.hfader .cap::after{top:4px;bottom:4px;left:50%;width:2px;margin-left:-1px}

/* Tiroirs */
.drawer{position:absolute;inset:0;background:rgba(4,5,6,.74);border-radius:12px;display:grid;place-items:center;z-index:5;touch-action:auto}
.dpanel{width:900px;max-height:600px;background:#121315;border:1px solid #2e3034;border-radius:12px;display:grid;grid-template-rows:auto 1fr;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.dhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #2e3034}
.dhead h2{margin:0;font-size:24px;letter-spacing:.06em;text-transform:uppercase;flex:1}
.dbtn{height:40px;padding:0 16px;border-radius:6px;border:1px solid #0a0b0d;background:linear-gradient(#3a3c41,#26282c);font-size:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.dlist{list-style:none;margin:0;padding:0 18px;overflow-y:auto;touch-action:pan-y}
.dlist li{display:grid;grid-template-columns:28px 1fr 100px 96px 46px 46px 52px 52px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #222428;min-width:0}
.dlist .i{font-family:var(--font-lcd);color:var(--mute);font-size:15px}
.dlist .n{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dlist .m{font-family:var(--font-lcd);font-size:14px;color:var(--mute)}
.dlist .dbtn{padding:0}
.dlist .dbtn.a{color:var(--a)} .dlist .dbtn.b{color:var(--b)}
.dlist li.now .n{color:var(--go)}
.dnote{color:var(--mute);font-size:16px;padding:14px 0;line-height:1.4;display:block!important;border:0!important}
.sbody{padding:14px 18px 18px;overflow-y:auto;display:grid;gap:18px;touch-action:pan-y}
.sgroup h3{margin:0 0 8px;font-size:15px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;text-align:left;border:1px solid #2e3034;background:#1a1b1e;border-radius:8px;padding:10px 14px;touch-action:manipulation}
.opt i{width:20px;height:20px;border-radius:50%;border:2px solid var(--mute);margin-top:2px}
.opt[aria-checked="true"]{border-color:var(--cue)}
.opt[aria-checked="true"] i{border-color:var(--cue);background:radial-gradient(circle,var(--cue) 0 45%,transparent 50%)}
.opt b{display:block;font-size:19px;font-weight:600}
.opt span{display:block;font-size:15px;color:var(--mute);line-height:1.35;max-width:70ch}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:8px}
.seg .dbtn[aria-pressed="true"]{background:var(--fg);color:#111}

.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:#111;padding:12px 18px;border-radius:8px;font-weight:600;font-size:19px;z-index:9;max-width:1100px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.rotate{position:fixed;inset:0;z-index:20;background:rgba(6,7,8,.94);display:grid;place-items:center;text-align:center;padding:24px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px))}
.rotate div{display:grid;gap:14px;justify-items:center;max-width:30ch}
.rotate svg{width:64px;height:64px;stroke:var(--fg);fill:none;stroke-width:1.6}
.rotate p{margin:0;font-size:20px;line-height:1.3}
.rotate button{height:40px;padding:0 16px;border-radius:8px;border:1px solid #3a3c41;background:#1e2024;font-weight:600;letter-spacing:.06em}
@media (prefers-reduced-motion: reduce){.startbtn:active .face{transform:none}}

/* ---------- Logo WARTEK MACHINE ---------- */
.brandbar{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:26px;padding:0 6px}
.bline{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#20e6e8);box-shadow:0 0 10px #20e6e8,0 0 2px #fff}
.bline.r{background:linear-gradient(90deg,#ff4fd8,transparent);box-shadow:0 0 10px #ff4fd8,0 0 2px #fff}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:400;line-height:1}
.wlogo{height:58px;width:auto;display:block;
  filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 5px #20e6e8) drop-shadow(0 0 12px #20e6e8) drop-shadow(0 0 26px rgba(32,230,232,.7));animation:neonflick 7s infinite}
.w1{font-family:"Monoton","Orbitron","Exo 2",sans-serif;font-size:50px;letter-spacing:.05em;color:#d9fdff;
  text-shadow:0 0 2px #fff,0 0 8px #20e6e8,0 0 18px #20e6e8,0 0 36px #20e6e8,0 0 60px rgba(32,230,232,.6);animation:neonflick 7s infinite}
.w2{font-family:"Orbitron","Exo 2",sans-serif;font-weight:800;font-size:19px;letter-spacing:.6em;margin-right:-.6em;color:#ffe3f8;padding-top:0;
  text-shadow:0 0 4px #ff4fd8,0 0 12px #ff4fd8,0 0 26px rgba(255,79,216,.7)}
@keyframes neonflick{0%,18%,22%,62%,64%,100%{opacity:1}20%{opacity:.55}63%{opacity:.7}}
@media (prefers-reduced-motion: reduce){.w1,.wlogo{animation:none}}

/* ---------- Thème néon ---------- */
:root{
  --bg:#030709; --panel:#14181a; --panel-lo:#0b0e0f; --lcd:#03141a; --lcd-fg:#7ff6ff;
  --fg:#dfecee; --mute:#7b9196; --a:#20e6e8; --b:#ff4fd8; --go:#3dffb0; --blue:#20e6e8;
  --red:#ff3d6e; --orange:#ff9a3d; --yellow:#e5ff3d; --cue:#ffb13d; --alert:#ff3d6e; --neon:#20e6e8;
  --font-ui:"Exo 2","Barlow Condensed","Arial Narrow",sans-serif;
}
html,body{background:radial-gradient(ellipse at 50% 45%,#0a2a30 0,#04090b 55%,#020405 100%)}
.stage::before{content:"";position:absolute;inset:-8px;border:1.5px solid rgba(32,230,232,.45);border-radius:10px;pointer-events:none;
  box-shadow:0 0 22px rgba(32,230,232,.28),inset 0 0 22px rgba(32,230,232,.12)}
.panel,.mixer{background:linear-gradient(180deg,#171c1e,#101415 40%,#0a0d0e);border:1px solid rgba(32,230,232,.32);border-radius:6px;
  box-shadow:0 0 0 1px #000,0 0 26px rgba(32,230,232,.1),inset 0 0 30px rgba(0,0,0,.6)}
.phead{background:linear-gradient(90deg,rgba(32,230,232,.13),transparent 65%);border-bottom:1px solid rgba(32,230,232,.28)}
.phead h2{font-weight:500;letter-spacing:.06em;text-transform:none;color:#e9f7f8;font-size:23px}
.phead .tag{background:transparent;color:var(--deck);border:1.5px solid var(--deck);box-shadow:0 0 10px color-mix(in srgb,var(--deck) 60%,transparent)}
.sec{background:#111516;border:1px solid #1f2a2c;border-radius:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.sechead{font-weight:400;text-transform:none;font-size:22px;color:#e6f2f3;letter-spacing:.01em}
.fxsec .sechead{font-size:19px}
.loadgrid{border-bottom-color:#1f2a2c}
.lcd,.mlcd{background:var(--lcd);border:1px solid rgba(32,230,232,.32);box-shadow:inset 0 0 20px rgba(32,230,232,.1),0 0 10px rgba(32,230,232,.1)}
.empty{color:var(--neon);text-shadow:0 0 12px rgba(32,230,232,.8)}
.lcdinfo,.ml1{color:var(--lcd-fg)}
.ml2{color:#4fb3b8}
.fname{border-bottom-color:rgba(32,230,232,.22);background:rgba(32,230,232,.05)}
.browse{background:#0b1719;border:1px solid var(--neon);box-shadow:0 0 10px rgba(32,230,232,.35);color:var(--neon)}
.syncbtn{background:#0a1416;border-color:#000;box-shadow:0 0 0 1.5px rgba(32,230,232,.45);color:var(--neon)}
.syncbtn.lit{box-shadow:0 0 0 2px var(--neon),0 0 20px rgba(32,230,232,.7),inset 0 0 14px rgba(32,230,232,.3);color:#fff}
.cap,.cap2{text-transform:none;font-weight:500}
.cap2{font-size:18px}
.startbtn{background:radial-gradient(circle,#151a1c 0 58%,#040607 59% 62%,#20272a 63% 70%,#0a0d0e 71%)}
.startbtn::before{border-color:rgba(32,230,232,.35)}
.startbtn .face{background:radial-gradient(circle at 45% 35%,#173236,#0a1416 70%);box-shadow:inset 0 0 16px rgba(32,230,232,.25)}
.startbtn svg{fill:var(--neon);filter:drop-shadow(0 0 7px rgba(32,230,232,.9))}
.startbtn.on::before{border-color:var(--neon);box-shadow:0 0 26px rgba(32,230,232,.85),inset 0 0 12px rgba(32,230,232,.6)}
.startbtn.on .face{background:radial-gradient(circle at 45% 35%,#6ffbfd,#15c9cd 62%,#0a8b8f)}
.startbtn.on svg{fill:#031216;filter:none}
.startbtn.wait::before{border-color:var(--yellow);box-shadow:0 0 18px rgba(229,255,61,.7)}
.startbtn.idle .face{filter:saturate(.4) brightness(.65)}
.pad{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--pc) 24%,#0d1112),#090c0d 78%);border:1.5px solid var(--pc);color:var(--pc);
  box-shadow:0 0 12px color-mix(in srgb,var(--pc) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--pc) 22%,transparent)}
.pad svg{filter:drop-shadow(0 0 5px var(--pc))}
.pad small{color:#e6f2f3}
.pad.hit{background:var(--pc);color:#071012;filter:none;box-shadow:0 0 32px var(--pc)}
.pad.hit small{color:#071012}
.padlbl{background:#0e1314;border-color:#22302f;color:#cfe3e5;font-weight:500;text-transform:none}
.padlbl.custom{border-color:var(--neon);color:var(--neon);box-shadow:0 0 8px rgba(32,230,232,.35)}
.fxb{background:#0e1213;border:1px solid #22302f;color:#cfe3e5;box-shadow:none;font-weight:500;text-transform:none;font-size:18px}
.fxb[aria-pressed="true"]{background:rgba(32,230,232,.14);border-color:var(--neon);color:var(--neon);box-shadow:0 0 14px rgba(32,230,232,.5),inset 0 0 10px rgba(32,230,232,.2)}
.knob .ring{filter:drop-shadow(0 0 3px rgba(32,230,232,.45))}
.knob .cap,.knob.mid .cap{background:radial-gradient(circle at 40% 32%,#3a4246,#1b1f21 70%);box-shadow:0 3px 6px rgba(0,0,0,.85)}
.knob .cap::after,.knob.mid .cap::after{background:#e9fbfc}
.knob.metal .cap{inset:15px;background:radial-gradient(circle at 40% 32%,#3a4246,#191d1f 70%);box-shadow:0 6px 12px rgba(0,0,0,.9)}
.knob.metal .cap::before{display:none}
.knob.metal .cap::after{background:var(--neon);height:24%;width:4px;margin-left:-2px;box-shadow:0 0 6px var(--neon)}
.ticks span{color:#6fa3a8;font-weight:500}
.klabel{text-transform:none;font-weight:500;letter-spacing:.02em;font-size:14px;color:#d3e5e7}
.eq .lab{color:#6fa3a8}
.mini,.ico,.retour,.dbtn{background:#0e1213;border:1px solid #22302f;color:#cfe3e5;box-shadow:none}
.mini.on{border-color:var(--neon);color:var(--neon);background:rgba(32,230,232,.1);box-shadow:0 0 10px rgba(32,230,232,.45)}
.hpbtn{background:#0e1213;box-shadow:inset 0 0 0 1.5px rgba(255,177,61,.45);color:var(--cue)}
.hpbtn.on{background:var(--cue);color:#140b00;box-shadow:0 0 0 2px var(--cue),0 0 18px rgba(255,177,61,.8)}
.route{background:#110c05;border-color:rgba(255,177,61,.35);color:var(--cue);text-transform:none}
.smartbtn{background:radial-gradient(circle at 45% 35%,#152a2c,#0a1314 70%);color:var(--neon);box-shadow:0 0 0 2px rgba(32,230,232,.4),0 3px 6px rgba(0,0,0,.6)}
.smartbtn.on{background:radial-gradient(circle at 45% 35%,#6ffbfd,#15c9cd 70%);color:#031216;box-shadow:0 0 0 2px var(--neon),0 0 24px rgba(32,230,232,.85)}
.vfader .slot,.hfader .slot{background:#000;box-shadow:0 0 0 1px rgba(32,230,232,.28)}
.vfader::before,.hfader::before{opacity:.35}
.vfader .cap,.hfader .cap{background:linear-gradient(#2c3437,#13181a);border-color:#000}
.vfader .cap::after,.hfader .cap::after{background:var(--neon);box-shadow:0 0 6px var(--neon)}
.air.pub{background:var(--go);color:#03140c}
.air.hp{background:var(--neon);color:#031216}
.dpanel{background:#0b1011;border-color:rgba(32,230,232,.35);box-shadow:0 0 30px rgba(32,230,232,.15),0 20px 60px rgba(0,0,0,.7)}
.dhead{border-bottom-color:rgba(32,230,232,.25)}
.opt{background:#0f1516;border-color:#22302f}
.opt[aria-checked="true"]{border-color:var(--neon)}
.opt[aria-checked="true"] i{border-color:var(--neon);background:radial-gradient(circle,var(--neon) 0 45%,transparent 50%)}
.seg .dbtn[aria-pressed="true"]{background:var(--neon);color:#031216}
.toast{background:#0b1b1e;color:var(--lcd-fg);border:1px solid var(--neon);box-shadow:0 0 22px rgba(32,230,232,.4)}

/* ---------- Skins (thèmes) ---------- */
.skinbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:46px;padding:0 14px;border-radius:6px;border:1px solid rgba(32,230,232,.45);background:#0b1416;color:var(--neon);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:8px;z-index:2;touch-action:manipulation}
.skinbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.brandbar{position:relative}
.skins{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px 18px 20px}
.skin{border:2px solid #22302f;border-radius:10px;padding:0;overflow:hidden;background:#101617;text-align:left;touch-action:manipulation}
.skin .sw{height:110px;display:grid;place-items:center;font-size:26px;font-weight:700;letter-spacing:.06em}
.skin b{display:block;padding:8px 10px 2px;font-size:18px}
.skin span{display:block;padding:0 10px 10px;font-size:13px;color:var(--mute);line-height:1.3}
.skin[aria-pressed="true"]{border-color:var(--neon);box-shadow:0 0 14px rgba(32,230,232,.5)}

html:has(body[data-skin="apo"]),body[data-skin="apo"]{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),var(--bunker) center/cover no-repeat,#0b0908}

body[data-skin="apo"] .panel,body[data-skin="apo"] .mixer{position:relative;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(70,30,8,.55) 100%),var(--metal) 0 0/420px;border:2px solid #0b0b0b;border-radius:5px;

body[data-skin="apo"] .phead{background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.18));border-bottom:1px solid #0b0b0b;box-shadow:0 1px 0 rgba(255,255,255,.05)}

body[data-skin="apo"] .smart{position:relative}
body[data-skin="apo"] .smart::after{content:"SALVAGED";position:absolute;right:-14px;bottom:10px;transform:rotate(-14deg);font-weight:800;font-size:13px;letter-spacing:.1em;color:rgba(190,40,30,.85);border:2px solid rgba(190,40,30,.75);border-radius:3px;padding:1px 5px;opacity:.85;pointer-events:none}
body[data-skin="apo"] .startbtn:not(.on) .face svg{display:none}
body[data-skin="apo"] .startbtn:not(.on) .face::after{content:"\2622\FE0E";font-size:50px;line-height:1;color:#d9c48a;text-shadow:0 0 10px rgba(232,196,106,.55),0 2px 0 #000}
body[data-skin="apo"] .logo::before{content:"\2623\FE0E"}
body[data-skin="apo"] .logo::after{content:"\2622\FE0E  RADIATION WARNING"}
body[data-skin="apo"] .phead .sp::before{content:"\2622\FE0E"}
/* Néon à moitié cassé : une partie des tubes reste presque éteinte, une autre grésille */
.wlwrap{position:relative;display:block;line-height:0}
.wlwrap .ghost{display:none}
/* couche 1 : tous les tubes, éteints (verre gris) */
body[data-skin="apo"] .wlwrap > .wlogo{filter:grayscale(1) brightness(.42) contrast(1.2) drop-shadow(0 1px 1px #000);animation:none}
/* couche 2 : les tubes qui marchent encore */
.wlwrap .layer{display:none}
/* couches pré-découpées : tubes qui marchent (lit) et tubes cassés qui grésillent (ghost) */
body[data-skin="apo"] .wlwrap .layer{display:block;position:absolute;left:0;top:0;height:58px;width:auto;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 4px #20e6e8) drop-shadow(0 0 12px rgba(32,230,232,.6))}
body[data-skin="apo"] .wlwrap .lit{animation:apoBuzz 5.3s infinite}
body[data-skin="apo"] .wlwrap .ghost{animation:apoFlick 3.7s infinite steps(1)}
@keyframes apoFlick{0%,100%{opacity:0}7%{opacity:.9}8%{opacity:0}9%{opacity:.7}11%{opacity:0}46%{opacity:0}47%{opacity:1}52%{opacity:1}53%{opacity:0}54%{opacity:.8}55%{opacity:0}80%{opacity:.4}81%{opacity:0}}
@keyframes apoBuzz{0%,100%{opacity:1}31%{opacity:1}32%{opacity:.72}33%{opacity:1}70%{opacity:1}71%{opacity:.85}72%{opacity:1}}
@media (prefers-reduced-motion: reduce){body[data-skin="apo"] .wlwrap .layer{animation:none}}

html:has(body[data-skin="apo"]),body[data-skin="apo"]{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),var(--ref-bg) center/cover no-repeat,#0b0908}
body[data-skin="apo"] .logo{width:620px;height:103px;padding:0;background:var(--ref-plate) center/100% 100% no-repeat;border:none;box-shadow:0 8px 20px rgba(0,0,0,.85);overflow:hidden}
body[data-skin="apo"] .logo > *{visibility:hidden}
body[data-skin="apo"] .bline{visibility:hidden}
body[data-skin="apo"] .logo::before,body[data-skin="apo"] .logo::after{display:none}
body[data-skin="apo"] .knob .cap,body[data-skin="apo"] .knob.mid .cap{background:var(--ref-ksmall) center/cover;box-shadow:0 4px 7px rgba(0,0,0,.85)}
body[data-skin="apo"] .knob.metal .cap{inset:12px;background:var(--ref-kbig) center/cover;box-shadow:0 6px 12px rgba(0,0,0,.9)}
body[data-skin="apo"] .knob .cap::after,body[data-skin="apo"] .knob.metal .cap::after{display:none}
body[data-skin="apo"] .smartbtn{background:var(--ref-smart) center/cover;color:transparent;text-shadow:none;box-shadow:0 6px 14px rgba(0,0,0,.85)}
body[data-skin="apo"] .smartbtn.on{box-shadow:0 0 0 3px #5fd0c8,0 0 22px rgba(95,208,200,.6)}

/* ===== ANNÉES 90 : plastique beige, écrans LCD vert olive, boutons gris ===== */
body[data-skin="y90"]{--neon:#2f8f6a;--lcd:#1d2416;--lcd-fg:#b8d58a;--fg:#2b2a26;--mute:#6d6a5f;--font-ui:"Barlow Condensed","Arial Narrow",sans-serif;--font-lcd:"VT323","Share Tech Mono",monospace;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>")}
html:has(body[data-skin="y90"]),body[data-skin="y90"]{background:#1a1916}
body[data-skin="y90"] .stage::before{border:none;box-shadow:0 20px 60px rgba(0,0,0,.7);background:var(--grain),linear-gradient(#e2dbc6,#cfc6ad);border-radius:14px;z-index:-1;inset:-10px}
body[data-skin="y90"] .panel,body[data-skin="y90"] .mixer{background:var(--grain),linear-gradient(#ebe5d3,#d8d0b9);border:1px solid #a89f86;border-radius:8px;box-shadow:inset 0 2px 0 #fffaf0,inset 0 -3px 0 #b5ab92,0 3px 0 #9d947c}
body[data-skin="y90"] .phead{background:none;border-bottom:1px solid #b5ab92}
body[data-skin="y90"] .phead h2{color:#2b2a26;font-weight:700}
body[data-skin="y90"] .phead .tag{box-shadow:none}
body[data-skin="y90"] .air.pub{background:#3a7a4a;color:#e9f5d8}
body[data-skin="y90"] .sec{background:linear-gradient(#e4ddca,#d4cbb3);border:1px solid #b5ab92;box-shadow:inset 0 1px 0 #fffaf0}
body[data-skin="y90"] .sechead,body[data-skin="y90"] .cap2,body[data-skin="y90"] .cap,body[data-skin="y90"] .klabel,body[data-skin="y90"] .eq .lab{color:#2b2a26;font-weight:700}
body[data-skin="y90"] .ticks span{color:#4a473e}
body[data-skin="y90"] .lcd,body[data-skin="y90"] .mlcd,body[data-skin="y90"] .queue{background:#1d2416;border:6px solid #3a3a34;border-radius:10px;box-shadow:inset 0 0 18px rgba(0,0,0,.8),0 1px 0 #fffaf0}
body[data-skin="y90"] .empty{color:#b8d58a;text-shadow:none}
body[data-skin="y90"] .browse,body[data-skin="y90"] .qadd{background:transparent;border:none;color:#b8d58a;box-shadow:none}
body[data-skin="y90"] .syncbtn{background:#1d2416;box-shadow:0 0 0 4px #3a3a34;color:#b8d58a}
body[data-skin="y90"] .syncbtn.lit{box-shadow:0 0 0 4px #3a3a34,0 0 0 6px #2f8f6a}
body[data-skin="y90"] .startbtn{background:radial-gradient(circle,#cfc8b8 0 58%,#8f887a 59% 62%,#e6e0d2 63% 70%,#a39b88 71%)}
body[data-skin="y90"] .startbtn::before{border-color:#9d9688}
body[data-skin="y90"] .startbtn .face{background:radial-gradient(circle at 45% 35%,#f2eee4,#c7c0b0 65%,#a39b8c);box-shadow:inset 0 -5px 8px rgba(0,0,0,.25),inset 0 3px 5px #fff}
body[data-skin="y90"] .startbtn svg{fill:#3b3a33;filter:none}
body[data-skin="y90"] .startbtn.on::before{border-color:#2f8f6a;box-shadow:none}
body[data-skin="y90"] .startbtn.on .face{background:radial-gradient(circle at 45% 35%,#e8f2e0,#b8c8a8 65%,#8fa080)}
body[data-skin="y90"] .knob .cap,body[data-skin="y90"] .knob.mid .cap,body[data-skin="y90"] .knob.metal .cap{background:repeating-conic-gradient(#3a3934 0 8deg,#2a2925 8deg 16deg);box-shadow:0 3px 4px rgba(0,0,0,.45),inset 0 0 0 4px #33322d}
body[data-skin="y90"] .knob .cap::after,body[data-skin="y90"] .knob.metal .cap::after{background:#e8402c;box-shadow:none}
body[data-skin="y90"] .knob .ring{filter:none}
body[data-skin="y90"] .fxb,body[data-skin="y90"] .mini,body[data-skin="y90"] .ico,body[data-skin="y90"] .retour,body[data-skin="y90"] .dbtn,body[data-skin="y90"] .padlbl{background:linear-gradient(#d2cec4,#a9a497);border:1px solid #6d695f;color:#2b2a26;font-weight:700;box-shadow:inset 0 1px 0 #f2eee6,0 2px 0 #7d786c}
body[data-skin="y90"] .fxb[aria-pressed="true"],body[data-skin="y90"] .mini.on{background:linear-gradient(#e0a08a,#b8705c);color:#2b1a14;border-color:#8a4a38;box-shadow:inset 0 1px 0 #f6c6b6,0 2px 0 #6a3a2c}
body[data-skin="y90"] .pad{background:linear-gradient(#3a3934,#25241f);border:3px solid #1a1916;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--pc) 70%,#000),0 3px 0 #11100e}
body[data-skin="y90"] .pad small{color:#e8e3d6}
body[data-skin="y90"] .smartbtn{background:radial-gradient(circle at 45% 35%,#f2eee4,#c7c0b0 65%,#a39b8c);color:#2b2a26;box-shadow:0 0 0 4px #8f887a,0 3px 0 #6d6a5f}
body[data-skin="y90"] .smartbtn.on{background:radial-gradient(circle at 45% 35%,#d8f0c8,#9fc88a 65%,#6f9a5a);box-shadow:0 0 0 4px #2f8f6a}
body[data-skin="y90"] .hpbtn,body[data-skin="y90"] .route{background:#2b2a26;color:#ffb13d}
body[data-skin="y90"] .vfader .slot,body[data-skin="y90"] .hfader .slot{background:#2b2a26;box-shadow:none}
body[data-skin="y90"] .vfader .cap,body[data-skin="y90"] .hfader .cap{background:linear-gradient(#e2ddd2,#a39d90);border-color:#55524a}
body[data-skin="y90"] .vfader .cap::after,body[data-skin="y90"] .hfader .cap::after{background:#2b2a26;box-shadow:none}
body[data-skin="y90"] .wlogo{filter:hue-rotate(40deg) saturate(1.6) drop-shadow(0 0 4px #6a5cff) drop-shadow(0 0 10px #6a5cff)}
body[data-skin="y90"] .w2{color:#c05ce0;text-shadow:0 0 6px #e07cff}
body[data-skin="y90"] .bline{background:linear-gradient(90deg,transparent,#7fe0e0);box-shadow:none}
body[data-skin="y90"] .bline.r{background:linear-gradient(90deg,#e07cff,transparent)}
body[data-skin="y90"] .fname,body[data-skin="y90"] .fname button,body[data-skin="y90"] .lcdinfo,body[data-skin="y90"] .qhead,body[data-skin="y90"] .qlist li{color:#c8e09a}
body[data-skin="y90"] .route b{color:#ffe0b0}
body[data-skin="y90"] .skinbtn{background:linear-gradient(#d2cec4,#a9a497);border:1px solid #6d695f;color:#2b2a26;box-shadow:0 2px 0 #7d786c}

/* ===== HORREUR : métal sombre, sang, impacts, crânes ===== */
body[data-skin="horror"]{--neon:#d42020;--lcd:#0b0a0a;--lcd-fg:#cfe0e0;--fg:#e2dcd8;--mute:#8f8682;--font-ui:"Barlow Condensed","Arial Narrow",sans-serif;
  --blood:radial-gradient(ellipse 30px 18px at 14% 22%,rgba(140,8,8,.85),transparent 70%),radial-gradient(circle 9px at 18% 30%,rgba(120,6,6,.8),transparent 70%),radial-gradient(ellipse 44px 26px at 82% 66%,rgba(130,6,6,.8),transparent 70%),radial-gradient(circle 6px at 76% 74%,rgba(150,10,10,.8),transparent 70%),radial-gradient(circle 4px at 88% 58%,rgba(150,10,10,.8),transparent 70%);
  --hole:radial-gradient(circle 9px at 62% 14%,#000 0 5px,#3a3330 6px,rgba(0,0,0,.5) 9px,transparent 10px),radial-gradient(circle 9px at 30% 84%,#000 0 5px,#3a3330 6px,rgba(0,0,0,.5) 9px,transparent 10px)}

<script>
(function(){
const $ = id => document.getElementById(id);

const RES = 150, ZOOM_SPAN = 8;

/* ---------- Mise à l'échelle ---------- */
const stage = $('stage'), fitbox = $('fitbox');

let toastTimer;

/* ---------- Audio : bus public et bus casque ---------- */
const AC = window.AudioContext || window.webkitAudioContext;

bandsIn.connect(xRest[0]); xRest[1].connect(xMid[0]); xRest[1].connect(xHigh[0]);
xMid[1].connect(cMid); cMid.connect(bandsOut); xHigh[1].connect(cHigh); cHigh.connect(bandsOut);
bandsOut.connect(limiter);

const quadOK = dest.maxChannelCount >= 4;

function setRoute(mode){
  if (mode === 'quad' && !quadOK) return;

setRoute('normal');

document.addEventListener('pointerdown', () => { if (ctx.state !== 'running') ctx.resume(); }, {capture:true});
let wakeLock = null;
async function keepAwake(){ try { if (!wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch(e){} }

/* ---------- Mémoire du téléphone : tes samples et tes morceaux importés ---------- */
let dbP = null;
function openDB(){
  if (!dbP) dbP = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('mix-de-poche', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('samples'); r.result.createObjectStore('tracks', {keyPath: 'id'}); };

}

const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));

}
// Marqueurs posés à la main, à l'endroit où joue la platine (calés sur le temps ou la mesure)
function setMarker(d, kind){

  const bl = 60 / t.bpm, pos = d.pos(); t.markers = t.markers || {};

    const k = Math.round((pos - t.firstBeat) / bl), fb = t.firstBeat + k * bl;
    t.firstBeat = t.start = d.firstBeat = d.cue = fb; t.markers.kick = fb;
    msg = `KICK posé à ${fmt(fb)} : les mesures et les phrases de 32 temps partent d'ici`;
  } else {
    const bar = 4 * bl, b = Math.max(0, Math.round((pos - t.firstBeat) / bar));
    t.markers[kind] = t.firstBeat + b * bar;

  }

  if (t.id) saveTrack(t);

}
document.addEventListener('click', e => { const b = e.target.closest('[data-mk]'); if (b) setMarker(decks[b.dataset.d], b.dataset.mk); });
function saveOrder(){ idb('samples', 'readwrite', st => st.put(lib.filter(t => t.id).map(t => t.id), '__order')).catch(() => {}); }

/* ---------- Analyse des morceaux ---------- */
function computePeaks(buf){
  const n = Math.ceil(buf.duration * RES);
  const hi = new Float32Array(n), lo = new Float32Array(n), rms = new Float32Array(n);
  const chs = []; for (let c = 0; c < Math.min(2, buf.numberOfChannels); c++) chs.push(buf.getChannelData(c));
  const per = buf.sampleRate / RES, a = 1 - Math.exp(-2 * Math.PI * 180 / buf.sampleRate), len = chs[0].length;
  let lp = 0;
  for (let b = 0; b < n; b++){
    const s0 = Math.floor(b * per), s1 = Math.min(len, Math.floor((b + 1) * per));
    let mh = 0, ml = 0, sq = 0;
    for (let i = s0; i < s1; i++){
      const x = chs.length > 1 ? (chs[0][i] + chs[1][i]) * 0.5 : chs[0][i];
      sq += x * x;
      lp += a * (x - lp);
      const ax = x < 0 ? -x : x, al = lp < 0 ? -lp : lp;
      if (ax > mh) mh = ax; if (al > ml) ml = al;
    }
    hi[b] = mh; lo[b] = ml; rms[b] = Math.sqrt(sq / Math.max(1, s1 - s0));
  }

  if (mr > 0) for (let b = 0; b < n; b++) rms[b] /= mr;
  let max = 0; for (let b = 0; b < n; b++) if (hi[b] > max) max = hi[b];
  const k = max > 0 ? 1 / max : 1;
  for (let b = 0; b < n; b++){ hi[b] *= k; lo[b] = Math.min(1, lo[b] * k * 1.8); }
  return {hi, lo, rms};
}

// Analyse du tempo en 3 étapes :
// 1. détection des attaques sur 3 bandes (basses, médiums, aigus) sur tout le morceau
// 2. tempo approximatif par autocorrélation
// 3. tempo exact par régression sur chaque temps du morceau (précision ~0,01 BPM), puis repérage du 1er temps de la mesure
async function analyzeBpm(buffer){
  const sr = 22050, dur = Math.min(buffer.duration, 480);
  const oc = new OfflineAudioContext(3, Math.ceil(dur * sr), sr);
  const src = oc.createBufferSource(); src.buffer = buffer;
  const mono = oc.createGain(); mono.channelCount = 1; mono.channelCountMode = 'explicit'; mono.channelInterpretation = 'speakers';
  src.connect(mono);
  const mk = (type, f, q) => { const b = oc.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
  const merger = oc.createChannelMerger(3);
  [mk('lowpass', 150, 0.7), mk('bandpass', 1800, 0.6), mk('highpass', 7000, 0.7)].forEach((f, c) => { mono.connect(f); f.connect(merger, 0, c); });

  const onset = new Float32Array(n), lowOn = new Float32Array(n), lowEnv = new Float32Array(n), W = [1, 0.7, 0.5];

    const d = out.getChannelData(c), env = new Float32Array(n);
    for (let i = 0; i < n; i++){ let a = 0; const o = i * hop; for (let j = 0; j < hop; j++){ const v = d[o + j]; a += v * v; } env[i] = Math.log1p(1000 * Math.sqrt(a / hop)); }

    for (let i = 1; i < n; i++){ const df = env[i] - env[i - 1]; if (df > 0){ onset[i] += W[c] * df; if (c === 0) lowOn[i] = df; } }
  }
  // seuil adaptatif : on garde ce qui dépasse la moyenne locale
  const half = Math.round(0.1 * fps), cs = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) cs[i + 1] = cs[i] + onset[i];
  const on = new Float32Array(n);
  for (let i = 0; i < n; i++){ const a = Math.max(0, i - half), b = Math.min(n, i + half + 1); on[i] = Math.max(0, onset[i] - (cs[b] - cs[a]) / (b - a)); }

  const kick = new Float32Array(n);
  for (let i = 0; i < n; i++){ const a = Math.max(0, i - half), b = Math.min(n, i + half + 1); kick[i] = Math.max(0, lowOn[i] - (cl[b] - cl[a]) / (b - a)) + 0.25 * on[i]; }

  const acAt = x => { const i = Math.floor(x), f = x - i; return i + 1 < ac.length ? ac[i] * (1 - f) + ac[i + 1] * f : 0; };
  let best = -1, bestL = lagMin;

    const bpm = 60 * fps / L, w = Math.exp(-0.5 * Math.pow(Math.log2(bpm / 165) / 0.6, 2));
    const sc = (ac[L] + 0.5 * acAt(2 * L) + 0.25 * acAt(4 * L)) * w;
    if (sc > best){ best = sc; bestL = L; }
  }
  const y0 = ac[bestL - 1], y1 = ac[bestL], y2 = ac[bestL + 1], den = y0 - 2 * y1 + y2;
  let P = bestL + (den < 0 ? 0.5 * (y0 - y2) / den : 0);

  while (60 * fps / P < 120) P /= 2; while (60 * fps / P >= 240) P *= 2;
  // Erreurs classiques de tempo (moitié, double, 2/3, 3/4…) : on garde la grille qui tombe le plus souvent sur un kick
  {
    const b0bpm = 60 * fps / P, prior = b => Math.exp(-0.5 * Math.pow(Math.log2(b / 165) / 0.6, 2));
    const comb = Pc => { let best = 0; for (let p = 0; p < Pc; p += 0.5){ let a = 0, c = 0; for (let x = p; x < n - 1; x += Pc){ const i = Math.round(x); a += Math.max(kick[i] || 0, kick[i - 1] || 0, kick[i + 1] || 0); c++; } if (c && a / c > best) best = a / c; } return best; };
    let bestS = -1, bestP = P;

    }

  }

  // 3. phase grossière puis régression sur les temps réels
  let bs = -1, ph = 0;

  let a0 = ph, b0 = P;
  const fit = (span, win, maxRes) => {

    for (const [k, t, w] of pts){ if (w < floor) continue; S += w; Sk += w * k; St += w * t; Skk += w * k * k; Skt += w * k * t; }

      const lo = Math.max(1, Math.floor(c - 0.03 * fps)), hi = Math.min(n - 2, Math.ceil(c + 0.03 * fps)); let bi = -1, bv = 0;
      for (let i = lo; i <= hi; i++) if (kick[i] > bv){ bv = kick[i]; bi = i; } if (bi > 0){ S += bv; Sd += bv * (bi - c); } }

  }
  // Temps ou contretemps ? La grosse caisse (sur le temps) est le son le plus fort dans les basses.
  const peakAt = c => { let m = 0; const s0 = Math.max(0, Math.round(c)), s1 = Math.min(n, Math.round(c + 0.045 * fps)); for (let i = s0; i < s1; i++) if (lowEnv[i] > m) m = lowEnv[i]; return m; };
  let pOn = 0, pOff = 0;
  for (let k = 0; ; k++){ const c = a0 + k * b0; if (c + b0 >= n) break; if (c < 0) continue; pOn += peakAt(c); pOff += peakAt(c + b0 / 2); }
  if (pOff > pOn * 1.04) a0 += b0 / 2;
  // 1er temps de la mesure : là où l'énergie des basses change (drops, breaks, nouvelles phrases)
  // grille complète depuis le tout début du fichier (pas seulement depuis le 1er temps ayant servi au calcul)
  const c0 = a0 - Math.floor(a0 / b0) * b0;
  const beats = []; for (let k = 0; ; k++){ const c = c0 + k * b0; if (c >= n) break; beats.push(c); }
  const be = beats.map((c, k) => { const s0 = Math.round(c), s1 = Math.min(n, Math.round(c + b0)); let a = 0; for (let i = s0; i < s1; i++) a += lowEnv[i]; return a / Math.max(1, s1 - s0); });
  const scores = [0, 0, 0, 0];
  for (let f = 0; f < 4; f++) for (let k = f + 4; k + 4 <= be.length; k += 4){ let x = 0, y = 0; for (let j = 0; j < 4; j++){ x += be[k + j]; y += be[k - 4 + j]; } scores[f] += (x - y) * (x - y); }
  const order = [0, 1, 2, 3].sort((x, y) => scores[y] - scores[x]);
  let phi = order[0];

  const lv = beats.map(c => peakAt(c)), sorted = [...lv].sort((x, y) => x - y), med = sorted[Math.floor(sorted.length / 2)] || 0, base = sorted[0] || 0;

    const f = this.filt, now = ctx.currentTime;
    if (Math.abs(v) < 0.03){ f.type = 'lowpass'; f.frequency.setTargetAtTime(22000, now, 0.02); f.Q.value = 0.7; }
    else if (v < 0){ f.type = 'lowpass'; f.Q.value = 1.4; f.frequency.setTargetAtTime(20000 * Math.pow(0.01, -v), now, 0.02); }
    else { f.type = 'highpass'; f.Q.value = 1.4; f.frequency.setTargetAtTime(20 * Math.pow(150, v), now, 0.02); }
  }
  trigger(i){
    const s = this.samples[i]; if (!s || !s.buffer) return;
    const src = ctx.createBufferSource(); src.buffer = s.buffer; const g = gain(0.9);
    src.connect(g); g.connect(this.input); src.start();
  }
}
function fmt(s, dec = 1){ s = Math.max(0, s); const m = Math.floor(s / 60); const r = s - m * 60; const rs = dec ? r.toFixed(1) : Math.floor(r).toString(); return `${m}:${r < 10 ? '0' : ''}${rs}`; }

/* ---------- Potards et faders ---------- */
class Ctl {
  constructor(el, o){
    Object.assign(this, {min:0, max:100, value:0, type:'knob', origin:null, labelEl:null, labelText:'', label:'', color:'#ffffff', format:v => Math.round(v), onChange:()=>{}, onGrab:null}, o);
    this.el = el; this.def = o.def ?? o.value; if (this.origin === null) this.origin = this.min;
    el.setAttribute('role', 'slider'); el.tabIndex = 0;
    el.setAttribute('aria-valuemin', this.min); el.setAttribute('aria-valuemax', this.max);
    if (this.label) el.setAttribute('aria-label', this.label);
    if (this.type === 'knob'){ el.insertAdjacentHTML('afterbegin', '<div class="ring"></div><div class="cap"></div>'); this.ring = el.querySelector('.ring'); this.cap = el.querySelector('.cap'); }
    else el.innerHTML = '<div class="slot"></div><div class="cap"></div>';
    let drag = null, hideT;
    const grab = () => { if (this.onGrab) this.onGrab(); };
    el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); drag = {x: e.clientX, y: e.clientY, v: this.value}; grab(); this.showVal(true); });
    el.addEventListener('pointermove', e => {
      if (!drag) return;
      const r = el.getBoundingClientRect(); let df;
      if (this.type === 'knob') df = (drag.y - e.clientY) / 160;
      else if (this.type === 'v') df = (drag.y - e.clientY) / (r.height * 0.85);
      else df = (e.clientX - drag.x) / (r.width * 0.85);
      let v = drag.v + df * (this.max - this.min);
      if (this.detent && Math.abs(v - this.def) < (this.max - this.min) * 0.015) v = this.def;
      this.set(v);
    });
    const end = () => { if (!drag) return; drag = null; clearTimeout(hideT); hideT = setTimeout(() => this.showVal(false), 700); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('dblclick', () => { grab(); this.set(this.def); });
    el.addEventListener('keydown', e => {
      const step = (this.max - this.min) / 50;
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight'){ grab(); this.set(this.value + step); e.preventDefault(); }
      if (e.key === 'ArrowDown' || e.key === 'ArrowLeft'){ grab(); this.set(this.value - step); e.preventDefault(); }
    });
    this.render();
  }
  frac(v = this.value){ return (v - this.min) / (this.max - this.min); }
  set(v, fire = true){ v = clamp(v, this.min, this.max); if (v === this.value && fire !== 'force') return; this.value = v; this.render(); if (fire) this.onChange(v); }
  showVal(on){ if (!this.labelEl) return; this.labelEl.classList.toggle('show', on); this.labelEl.textContent = on ? this.format(this.value) : this.labelText; }
  render(){
    const f = this.frac();
    this.el.setAttribute('aria-valuenow', Math.round(this.value * 100) / 100);
    if (this.labelEl && this.labelEl.classList.contains('show')) this.labelEl.textContent = this.format(this.value);
    if (this.type === 'knob'){
      const ang = x => -135 + 270 * x;
      this.cap.style.transform = `rotate(${ang(f)}deg)`;
      const a0 = Math.min(ang(this.frac(this.origin)), ang(f)), a1 = Math.max(ang(this.frac(this.origin)), ang(f));
      this.ring.style.background = `conic-gradient(from ${a0}deg, ${this.color} 0deg ${a1 - a0}deg, transparent ${a1 - a0}deg 360deg), conic-gradient(from -135deg, #1c2a2c 0deg 270deg, transparent 270deg 360deg)`;
    } else this.el.style.setProperty('--p', this.type === 'v' ? 1 - f : f);
  }
}
function knob(parent, label, cls = '', o = {}){
  const w = document.createElement('div'); w.className = 'kwrap';
  w.innerHTML = `<div class="knob ${cls}"></div><span class="klabel">${label}</span>`;
  parent.appendChild(w);
  return new Ctl(w.firstChild, Object.assign({labelEl: w.lastChild, labelText: label, label}, o));
}

// Table de mixage : HI / MID / LOW / CFX de chaque voie, et les potards du centre
const eq = $('eq');
eq.innerHTML = '';
const dbFmt = v => v <= -25.5 ? 'KILL' : `${v > 0 ? '+' : ''}${v.toFixed(1)} dB`;
const cfxFmt = v => Math.abs(v) < 3 ? 'OFF' : (v < 0 ? `LP ${Math.round(-v)}` : `HP ${Math.round(v)}`);

['hi', 'mid', 'lo', 'filt'].forEach((band, row) => {

knob(center[1], 'Cue/Mix', '', {min: 0, max: 100, value: 0, color: '#ffb13d', format: v => v < 3 ? 'CUE' : v > 97 ? 'MASTER' : `${Math.round(100 - v)}/${Math.round(v)}`,
  onChange: v => { const x = v / 100; cueToHp.gain.setTargetAtTime(Math.cos(x * Math.PI / 2), ctx.currentTime, 0.02); masterToHp.gain.setTargetAtTime(Math.sin(x * Math.PI / 2), ctx.currentTime, 0.02); }});
knob(center[2], 'Casque', '', {min: 0, max: 100, value: 80, color: '#ffb13d', format: v => `${Math.round(v)}%`, onChange: v => hpSum.gain.setTargetAtTime(v / 100, ctx.currentTime, 0.02)});
